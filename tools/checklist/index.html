he more they checked, the more they longed for their ex. More distress. Less personal growth.\n\nThe surprise: staying friends wasn't the problem. The checking was.\n\nSo the friend list can stay. Just put the phone down.\n\nWhen did you last check? 👇\n\nNot just you (Correlation, not proof: people who are still hung up may simply check more. Mostly young, female, US participants. Staying friends also went with a little less personal growth.)\n\nSources: Lukacs & Quan-Haase (2015), \"Romantic breakups on Facebook\", Information, Communication & Society · Marshall (2012), \"Facebook Surveillance of Former Romantic Partners\", Cyberpsychology, Behavior, and Social Networking", "date": "2026-11-09", "time": "18:30"}, {"no": 111, "title": "STRAIGHT FANTASY", "caption": "You're straight. And you've had a same-sex fantasy. You're far from alone. 🌈\n\nResearchers asked over 1,500 adults about their fantasies. 85% of them were straight.\n\nWomen: 37% had fantasized about sex with a woman. Men: 21%. One in five.\n\nYet only 6% of the women, and under 2% of the men, said they were gay.\n\nSo a fantasy isn't a label. It's just a fantasy.\n\nNo label needed. Just save it. 🔖\n\nNot just you (One online survey in Quebec, Canada. The percentages are for the whole sample, which was mostly but not only straight.)\n\nSource: Joyal, Cossette & Lapierre (2015), \"What Exactly Is an Unusual Sexual Fantasy?\", Journal of Sexual Medicine", "date": "2026-11-10", "time": "18:30"}, {"no": 112, "title": "DESIRE GAP", "caption": "You want it more than your partner. Or less. Most couples know this. 💞\n\nIn one study, 80% remembered a recent time their desire didn't match their partner's.\n\nSo researchers followed couples for three weeks. Every day, both partners rated their desire.\n\nWhat helped: caring about each other's needs. People who wanted their partner to feel loved were more open, even when they weren't in the mood. And both partners were happier.\n\nBut only when it was free. Out of guilt or pressure, it doesn't work. And a no gets accepted.\n\nSo it's not about who's right. It's about caring. Both ways.\n\nSend this to your partner. 👇\n\nNot just you (Three studies from one lab. A link, not proof. Consent first, always.)\n\nSource: Day, Muise, Joel & Impett (2015), \"To Do It or Not to Do It? How Communally Motivated People Navigate Sexual Interdependence Dilemmas\", Personality and Social Psychology Bulletin", "date": "2026-11-11", "time": "18:30"}, {"no": 113, "title": "BEDTIMES", "caption": "You and your partner go to bed at different times. That costs more than sleep. 🌙\n\nA study compared 150 couples: morning people, night owls, and mixed pairs.\n\nThe mismatched couples had more conflict. Less serious talk. Less time together. And less sex.\n\nA newer study tracked couples with sleep sensors. When wives were happier with the marriage, the couple slept more in sync.\n\nYou don't have to be the same type. One idea: go to bed together. The night owl can get up again.\n\nWho's the night owl? 👇\n\nNot just you (Both studies show a link, not proof: unhappy couples may also drift apart at night. The first study is from 1991. Going to bed together is an idea, not something these studies tested.)\n\nSources: Larson, Crane & Smith (1991), \"Morning and Night Couples\", Journal of Marital and Family Therapy · Gunn et al. (2015), \"Sleep Concordance in Couples Is Associated with Relationship Characteristics\", Sleep", "date": "2026-11-12", "time": "18:30"}, {"no": 114, "title": "FRIEND ENVY", "caption": "Your friend's success stings. That doesn't make you a bad friend. 🫣\n\nIn a classic experiment, men brought a friend to a word-guessing game. They could give easy clues or hard ones.\n\nThen the researchers said the game measured intelligence. And they gave their friend harder clues than a stranger. In 10 of 13 sessions.\n\nWhen it's not your thing, you cheer for your friend. When it is your thing, their win can feel like your loss.\n\nWhat helps: celebrate anyway. In studies on good news, an excited, curious reply went with closer relationships.\n\nSo feel the sting. Then say: tell me everything.\n\nTag a friend you're proud of. 👇\n\nNot just you (The 1980 experiment was small and only included men. When the game was described as unimportant, friends got the easier clues. The good-news studies show a link, not proof.)\n\nSources: Tesser & Smith (1980), \"Some Effects of Task Relevance and Friendship on Helping\", Journal of Experimental Social Psychology · Gable, Reis, Impett & Asher (2004), \"What Do You Do When Things Go Right?\", Journal of Personality and Social Psychology", "date": "2026-11-13", "time": "18:30"}, {"no": 115, "title": "REACH OUT", "caption": "You lost touch with a friend. Text them today. 📲\n\nIn a series of experiments with more than 5,900 people, participants sent a short note to someone they hadn't talked to in a while.\n\nFirst, they guessed how much it would be appreciated. Then the friends answered: they loved it more than the senders expected.\n\nAnd the more out of the blue the message was, the bigger the gap.\n\nSo send the text. Right now. It means more than you think.\n\nWho are you texting? 👇\n\nNot just you (Experiments by one research team. The bars in the video show the direction, not exact values.)\n\nSource: Liu, Rim, Min & Min (2022), \"The Surprise of Reaching Out: Appreciated More Than We Think\", Journal of Personality and Social Psychology", "date": "2026-11-20", "time": "18:30"}, {"no": 116, "title": "FRIEND PARADOX 2.0", "caption": "Your friends have more friends than you. That's math, not you. 🧮\n\nWe simulated a friend group of 26 people with one very popular person: 23 of 26 had fewer friends than their friends.\n\nWhy? Picture one very popular person. Lots of people count them as a friend. So whenever people look at their friends, that person shows up again and again, and the average goes up.\n\nA sociologist checked this in a high school: most students had fewer friends than their friends did. 55% of the girls.\n\nSo if everyone seems more social than you: that's an illusion. Not a you problem.\n\nSend this to a friend. They have more. 👇\n\nNot just you (The \"friendship paradox\" is a property of networks. The school data come from a classic study of the late 1950s, analyzed in 1991.)\n\nSource: Feld (1991), \"Why Your Friends Have More Friends Than You Do\", American Journal of Sociology", "date": "2026-11-21", "time": "12:30"}, {"no": 117, "title": "STAY OR LEAVE", "caption": "You've thought about breaking up. And you stayed. 🚪\n\nResearchers followed over 1,300 people in relationships for ten weeks. Then 500 who were thinking about leaving.\n\nSo who stayed? The ones who believed their partner needed them. Even when they weren't happy themselves.\n\nSo staying often comes from caring. That's kind. Just don't forget your own needs.\n\nSave this for a hard day. 🔖\n\nNot just you (Two studies from one team, a link, not proof. If a relationship hurts you or you don't feel safe, please reach out to someone you trust or a local helpline.)\n\nSource: Joel, Impett, Spielmann & MacDonald (2018), \"How Interdependent Are Stay/Leave Decisions?\", Journal of Personality and Social Psychology", "date": "2026-11-21", "time": "09:00"}, {"no": 118, "title": "DISHES", "caption": "You fight about the dishes. That's not a small thing. 🍽️\n\nAsked what makes a good marriage, Americans said: faithfulness, 93%. Good sex, 70%. Sharing chores, 62%.\n\nBut a newer study found that splitting chores 50/50 isn't enough. What works: sharing the tasks themselves. Of couples who shared every task, 99% called it fair. Split 50/50 without sharing: only about half.\n\nSo don't just divide the chores. Do some together. Start with the dishes.\n\nWho does the dishes? 👇\n\nNot just you (US surveys, a link, not proof. Earlier work by the same researcher found sharing the dishes was the chore most tied to women's satisfaction.)\n\nSources: Pew Research Center (2007), \"Modern Marriage\" · Carlson (2022), Sex Roles · Carlson et al. (2018), Council on Contemporary Families", "date": "2026-11-21", "time": "18:30"}, {"no": 119, "title": "DEEP TALK", "caption": "You avoid deep talks because you think they'll be awkward. They're not. 💬\n\nIn twelve experiments with more than 1,800 people, strangers were paired up. Some got small talk questions. Others got deep ones. Like: when did you last cry in front of someone?\n\nFirst, they predicted how awkward it would be. Then they talked: far less awkward than expected. And the deep talks felt closer and more fun.\n\nPeople also underestimated how interested the other person was in them.\n\nSo skip the weather. Ask the real question.\n\nWhat's your best deep question? 👇\n\nNot just you (Mostly strangers in the lab, one research team. The bars show the direction, not exact values.)\n\nSource: Kardas, Kumar & Epley (2021), \"Overly Shallow? Miscalibrated Expectations Create a Barrier to Deeper Conversation\", Journal of Personality and Social Psychology", "date": "2026-11-21", "time": "21:30"}, {"no": 120, "title": "MORE SEX", "caption": "You think everyone is doing it more than you. They're not. 📅\n\nAcross 19 countries, people guessed how often young adults have sex: about 20 times a month. The real number: 5 to 6 times. That's what young adults themselves report.\n\nAnd in couples, happiness rose with sex only up to about once a week. More didn't add more.\n\nSo stop comparing. You're probably closer to normal than you think.\n\nSend this to someone who compares. 👇\n\nNot just you (The \"real\" numbers are self-reports from national surveys. The once-a-week finding is a link, not proof, and didn't show up for singles.)\n\nSources: Ipsos (2018), \"Perils of Perception\" · Muise, Schimmack & Impett (2016), \"Sexual Frequency Predicts Greater Well-Being, But More Is Not Always Better\", Social Psychological and Personality Science", "date": "2026-11-20", "time": "21:30"}, {"no": 121, "title": "SLEEP APART", "caption": "You sleep better alone. About a third of people sleep apart, at least sometimes. 🛏️🛏️\n\nIn a survey of 2,000 Americans, one in five sometimes sleeps in another room because of their partner. 15% do it regularly.\n\nAnd the ones who move out most often: men. 45%, versus 25% of women. Millennials most of all: 43%.\n\nSo sleeping apart isn't a breakup. Good sleep comes first. Just keep some time in bed together.\n\nTeam one bed or two? 👇\n\nNot just you (One online survey commissioned by the American Academy of Sleep Medicine. \"Keep some time in bed together\" is our idea, not a survey result.)\n\nSource: American Academy of Sleep Medicine (2023), \"Sleep Prioritization Survey\"", "date": "2026-11-22", "time": "09:00"}, {"no": 122, "title": "NEW FRIENDS", "caption": "You haven't made a new friend in years. That's not you. It's your age. 📉\n\nResearchers analyzed the calls of over 3 million phone users. How many people is each one in touch with? It peaks at 25.\n\nAfter that, our circle shrinks, until it levels off in our late forties.\n\nAnd a close friend takes over 200 hours together.\n\nSo it's not that you're hard to like. Life got full. Pick one person and keep showing up.\n\nTag the one you'll show up for. 👇\n\nNot just you (Phone calls from one European country in 2007 – calls, not friendships. The columns in the video show the shape, not exact values.)\n\nSources: Bhattacharya, Ghosh, Monsivais, Dunbar & Kaski (2016), \"Sex Differences in Social Focus Across the Life Cycle in Humans\", Royal Society Open Science · Hall (2019), \"How Many Hours Does It Take to Make a Friend?\", Journal of Social and Personal Relationships", "date": "2026-11-22", "time": "12:30"}, {"no": 123, "title": "THE LOOK", "caption": "You catch yourself looking at her body. Your eyes got there in a fifth of a second. 👀\n\nIn an eye-tracking study, men's first look at a woman's photo landed on her chest or waist. Faster than 200 milliseconds. Before her face.\n\nBut it's not just men: asked to rate a woman's looks, both men and women looked longer at her chest and waist than at her face.\n\nAnd being looked at has a cost. In an experiment, women whose bodies were stared at solved fewer math problems afterward: just under 5 of 12, versus about 6. Men's scores didn't drop.\n\nSo the first glance is fast. The stare is a choice. Look at her face.\n\nSend this to someone who stares. 👇\n\nNot just you (Three small studies, mostly with students and photos. Why the eyes go there – evolution, culture or both – is still debated.)\n\nSources: Dixson et al. (2011), Archives of Sexual Behavior · Gervais, Holland & Dodd (2013), \"My Eyes Are Up Here\", Sex Roles · Gervais, Vescio & Allen (2011), Psychology of Women Quarterly", "date": "2026-11-22", "time": "18:30"}, {"no": 124, "title": "BERKSON 2.0", "caption": "You think attractive people are mean. It's a statistics trick. 🎲\n\nLet's simulate it: 400 people. Looks and kindness are totally random, no link at all.\n\nNow you only date people who are attractive enough, kind enough, or both. Among the ones left, the better looking they are, the meaner they get.\n\nBecause the mean and plain ones never made your list. So the hot ones you meet don't need to be nice to get there.\n\nIt's called Berkson's paradox. It's not that hot people are mean. It's who you filtered out.\n\nSend this to someone who dates jerks. 👇\n\nNot just you (This is a simulation, a math model, not a survey. It shows how a filter alone can create a fake link.)\n\nSources: Berkson (1946), Biometrics Bulletin · Ellenberg (2014), \"How Not to Be Wrong\"", "date": "2026-11-23", "time": "09:00"}, {"no": 125, "title": "FIRST MOVE 2.0", "caption": "You wait for them to text first. Here's what that costs you. 💌\n\nLet's simulate it: ten people on each side. Everyone secretly ranks everyone. One side asks. The other side holds on to the best offer so far. Round after round, until everyone is matched.\n\nThe askers got their number two on average. The ones who waited: number five.\n\nSwap the sides, and it flips. The math is proven: in this model, asking never makes you worse off.\n\nIn this model, asking never makes you worse off. It's a proven theorem. Real dating is messier, of course. But the lesson holds: send the first message.\n\nSend the first message. Then save this. 🔖\n\nNot just you (A simulation of the Gale-Shapley matching model with random rankings, not a study of real couples. The model won a Nobel Prize in 2012 for its use in matching markets.)\n\nSources: Gale & Shapley (1962), \"College Admissions and the Stability of Marriage\", American Mathematical Monthly · Nobel Prize in Economic Sciences 2012 (Roth & Shapley)", "date": "2026-11-22", "time": "21:30"}, {"no": 126, "title": "37 RULE 2.0", "caption": "You settled too early. Or you waited too long. There's a rule for that. 🃏\n\nSay you'll date ten people, one after another. Once you pass on someone, they're gone. So when do you commit?\n\nThe math says: skip the first 37%. Just look. Then pick the first one who beats them all.\n\nWe simulated 1,000 love lives, ten dates each. The rule found the very best one 40% of the time. Committing to the first date, or picking at random: only about 10%.\n\nReal life is messier. People can say no, and you never know how many you'll meet. But the lesson holds: explore first. Then commit.\n\nToo early or too late? 👇\n\nNot just you (A simulation of the \"secretary problem\", a math model, not a study of real couples.)\n\nSources: Ferguson (1989), \"Who Solved the Secretary Problem?\", Statistical Science · Christian & Griffiths (2016), \"Algorithms to Live By\"", "date": "2026-11-23", "time": "12:30"}, {"no": 127, "title": "FIVE CLOSE", "caption": "You only have room for about four close people. 📞\n\nResearchers looked at about 6 billion phone calls between 35 million people. Who you call most forms circles:\n\nAbout 4 people. Then 11. Then 30. Then about 130.\n\nYour inner circle: about four. That's all most of us keep that close.\n\nSo losing touch with the rest isn't failing. It's a limit.\n\nWho are your four? 👇\n\nNot just you (Averages from call records in one European country, 2007. Calls are only a proxy for closeness. The classic estimate is 5 / 15 / 50 / 150.)\n\nSource: MacCarron, Kaski & Dunbar (2016), \"Calling Dunbar's numbers\", Social Networks", "date": "2026-11-23", "time": "18:30"}, {"no": 128, "title": "BIRTHDAY", "caption": "You're in a room with 23 people. Two of them probably share a birthday. 🎂\n\n365 days, only 23 birthdays. Sounds unlikely. So we simulated 1,000 rooms.\n\nAbout half of them had a match. The math says 50.7%. With 70 people: 99.9%.\n\nWhy? 23 people make 253 pairs. Every pair is a chance.\n\nEver met someone with your birthday? 👇\n\nNot just you (Simulation and math assume every day is equally likely and ignore leap years.)\n\nSource: the birthday problem, classic probability theory", "date": "2026-11-23", "time": "21:30"}, {"no": 129, "title": "FIVE TO ONE", "caption": "One fight with your partner needs about five good moments to balance it. ⚖️\n\nA researcher filmed couples while they argued, then checked who was still together years later.\n\nCouples who lasted: about 5 good moments for every bad one. Even during the fight.\nCouples close to a split: 1 to 1, or less.\n\nA joke. A touch. A nod. They add up.\n\nWhat's your go-to good moment mid-argument? 👇\n\nNot just you (Observational studies. The exact ratio is debated, and it's a pattern, not a rule for every couple.)\n\nSource: Gottman & Levenson (1992), Journal of Personality and Social Psychology · Gottman (1994), \"What Predicts Divorce?\"", "date": "2026-11-24", "time": "09:00"}, {"no": 130, "title": "NEXT DOOR", "caption": "Your closest friends probably live closer than you think. 🚪\n\nIn 1950, researchers mapped friendships in a student housing block.\n\nNext-door neighbors: 41% became friends.\nTwo doors away: 22%.\nEnd of the hall: only 10%.\n\nWe don't pick friends from everyone. We pick from who we run into.\n\nWho's your \"next door\" friend? 👇\n\nNot just you (One classic housing study from 1950. Later studies found the same pattern, for example with classroom seating.)\n\nSource: Festinger, Schachter & Back (1950), \"Social Pressures in Informal Groups\"", "date": "2026-11-24", "time": "12:30"}, {"no": 131, "title": "SPOTLIGHT", "caption": "You think everyone noticed your embarrassing shirt. They didn't. 👕\n\nIn a study, students had to wear a very embarrassing T-shirt into a room full of people.\n\nThe wearers guessed: about half of the room noticed (46%).\nThe real number: about one in four (23%).\n\nEveryone else is busy thinking about themselves. Just like you.\n\nWhat's the thing you were sure everyone noticed? 👇\n\nNot just you (One experiment with students. Later studies found the same overestimation, the exact size varies.)\n\nSource: Gilovich, Medvec & Savitsky (2000), Journal of Personality and Social Psychology", "date": "2026-11-24", "time": "18:30"}, {"no": 132, "title": "3.5 DEGREES", "caption": "You're only about three and a half people away from almost anyone. 🌍\n\nFacebook measured this in 2016, across 1.6 billion users.\n\nThe old idea: six steps between any two people.\nThe real average: 3.57 people in between. In the US: 3.46.\n\nYour friend knows someone, who knows someone.\n\nWho's the most surprising person you're connected to? 👇\n\nNot just you (Facebook users only. The network in the video is a made-up example to show how far-away friends create shortcuts.)\n\nSource: Bhagat et al. (2016), \"Three and a half degrees of separation\", Facebook Research", "date": "2026-11-24", "time": "21:30"}, {"no": 133, "title": "HAPPY SPREAD", "caption": "When your friend gets happier, you probably do too. 😊\n\nResearchers followed almost 5,000 people for 20 years.\n\nWhen a friend living nearby got happier, your chance of being happy went up by about 25%.\nAnd it spread up to three steps: to friends of friends of friends.\n\nYour mood travels further than you think.\n\nWho's the friend who always lifts your mood? 👇\n\nNot just you (Observational data, so it shows a link, not proof that happiness is \"contagious\". The 25% has a wide margin of error.)\n\nSource: Fowler & Christakis (2008), BMJ, Framingham Heart Study", "date": "2026-11-25", "time": "09:00"}, {"no": 134, "title": "BODY MAP", "caption": "You think men and women get turned on in different places. Their body maps say no. 🗺️\n\n704 people colored a body outline: where does a partner's touch turn you on?\n\nMen and women drew almost the same map. Genitals first, then chest, inner thighs, lips.\nWomen's maps were a little bigger: 26% of the body vs 22%.\n\nTurns out, we're more alike than we think.\n\nWhich spot surprised you? 👇\n\nNot just you (One online study with Finnish volunteers, more women than men. Self-reported maps, not measurements.)\n\nSource: Nummenmaa et al. (2016), \"Topography of Human Erogenous Zones\", Archives of Sexual Behavior", "date": "2026-11-25", "time": "12:30"}, {"no": 135, "title": "BODY VS MIND", "caption": "Your body can react before your mind is into it. Especially for women. 🧠\n\nResearchers combined 132 lab studies with over 4,000 people. They measured two things: what the body did, and what people said they felt.\n\nFor men, body and mind mostly moved together.\nFor women, much less. The body often reacted on its own.\n\nSo a body's reaction is not a yes. Only a clear yes is.\n\nDid you know this? 👇\n\nNot just you (Lab studies. Part of the gap comes from how arousal was measured. A body reaction says nothing about wanting or consent.)\n\nSource: Chivers et al. (2010), Archives of Sexual Behavior, meta-analysis", "date": "2026-11-25", "time": "18:30"}, {"no": 136, "title": "SPLIT IT ALL", "caption": "If we split all the world's wealth equally, 9 out of 10 people would get richer. 🪙\n\nResearchers added up what every adult on Earth owns: homes, savings, companies, minus debts.\n\nToday the richest 10% hold about 75% of it. The poorer half shares just 2%.\nSplit equally, every adult would get over $100,000. That's about 20 times what the poorer half owns now.\n\nIf your stack feels small, you're in the majority.\n\nWhat would you do with your equal share? 👇\n\nNot just you (A thought experiment, not a policy. Wealth is homes, firms and land, not cash you could hand out, and prices would change. Figures in purchasing-power dollars, rounded.)\n\nSource: World Inequality Report 2026 (World Inequality Lab); cross-check UBS Global Wealth Report 2026", "date": "2026-11-25", "time": "21:30"}, {"no": 137, "title": "GUESS, WISH, REAL", "caption": "How much does the richest fifth own? Most people guess way too low. 🪙\n\n5,522 Americans estimated how wealth is split, then built the split they'd wish for.\n\nTheir guess: the richest 20% own 59%.\nTheir wish: 32%.\nThe truth: 84%. The poorest 40% share less than 1%.\n\nWe picture the world fairer than it is.\n\nWhat would you have guessed? 👇\n\nNot just you (US data from the 2000s. Some people may have thought of income, not wealth. Only the top-fifth numbers are exact, the other bars are schematic.)\n\nSource: Norton & Ariely (2011), Perspectives on Psychological Science", "date": "2026-11-26", "time": "12:30"}, {"no": 138, "title": "THE MIDDLE", "caption": "Ask people where they stand, and almost everyone says: the middle. 🪜\n\nResearchers asked over 30,000 people in 10 countries where their household ranks.\n\nIn every country, at least 2 in 3 of the poorer people placed themselves too high.\nRicher people did the opposite and placed themselves too low.\nOnly a minority got their own step right.\n\nIf you feel pretty average, so does almost everyone.\n\nWhere would you place yourself? 👇\n\nNot just you (Survey data, rough income fifths. The \"richer people too low\" part comes from a separate study in Denmark. Dots are schematic.)\n\nSource: Hoy & Mager (2021), American Economic Journal: Economic Policy; Hvidberg, Kreiner & Stantcheva (2023), Review of Economic Studies", "date": "2026-11-26", "time": "18:30"}, {"no": 139, "title": "SPLIT THE INCOME", "caption": "If we split the world's income equally, people in rich countries would live on about a third. 🌍\n\nThe world produces about $26,000 per person a year (adjusted for prices).\n\nThe US and Germany sit about 3 times above that. India and Nigeria far below.\nSplit equally, everyone would live roughly like an average person in Mexico or Thailand today.\n\nRich countries would take a pay cut. Most of the world would get a raise.\n\nWould your life get better or worse? 👇\n\nNot just you (A thought experiment. Uses GDP per person in purchasing-power dollars, not take-home pay, and ignores how income is shared within each country. Figures rounded.)\n\nSource: IMF World Economic Outlook 2025 (GDP per capita, PPP). Part 2 of \"Split it all\" (No. 136)", "date": "2026-11-26", "time": "09:00"}, {"no": 140, "title": "RICH ON EARTH", "caption": "If you take home $20,000 a year, you're richer than 9 in 10 people on Earth. 🌍\n\nResearchers lined up everyone's income, after tax and adjusted for prices.\n\nThe person right in the middle lives on about $3,400 a year.\n$20,000 puts you in the top 10%. In Germany or the US, more than half of people are there.\n\nFeeling average at home can mean rich on Earth.\n\nDid you expect that? 👇\n\nNot just you (For a one-person household, after tax, in international dollars that adjust for living costs. Bars are schematic except the middle and the top-10% line.)\n\nSource: Our World in Data (2025), based on World Bank Poverty and Inequality Platform", "date": "2026-11-26", "time": "21:30"}, {"no": 141, "title": "WHERE'S THE LINE?", "caption": "Is flirting cheating? Fewer than half of Americans say yes. 🤔\n\n2,000 adults rated what counts as cheating in a marriage.\n\nA secret emotional bond: 76% say cheating.\nFlirting: 42%.\nFollowing an ex online: 32%.\nSecret porn: 30%.\n\nSo if you and your partner draw the line in different places, that's normal.\n\nWhere's your line? 👇\n\nNot just you (One US survey from 2019. \"Secret porn\" means without the partner knowing. Worth talking about before it matters.)\n\nSource: iFidelity Survey (YouGov 2019, Wheatley Institution & National Marriage Project), via Institute for Family Studies", "date": "2026-11-29", "time": "18:30"}, {"no": 142, "title": "LOVE IS NEW", "caption": "In 1967, 3 in 4 young American women wouldn't rule out marrying without love. 💍\n\nStudents were asked: would you marry someone perfect for you, if you weren't in love?\n\nOnly 24% of women said no. For most, love wasn't a must. (Among men it was 65%.)\nBy the 1990s, only 3.5% of Americans said yes.\n\nLove as the main reason to marry is newer than you think.\n\nWould you? 👇\n\nNot just you (College students in the US, so not everyone. In 1967 many women depended on marriage for money and status, which likely shaped their answers.)\n\nSource: Kephart (1967), Journal of Marriage and the Family; Levine et al. (1995), Journal of Cross-Cultural Psychology", "date": "2026-11-27", "time": "12:30"}, {"no": 143, "title": "WHAT COUNTRIES SELL", "caption": "More than half of all countries earn most of their export money from raw materials. 🛢️\n\nOil, metals, crops. Dug up or grown, then sold.\n\nOil and coal: from Norway to Nigeria to Saudi Arabia.\nGold, copper and other metals: much of Africa and the Andes.\nCrops: coffee in Ethiopia, cocoa in Ivory Coast, soy in Brazil.\nCars, phones and medicine: mostly Europe and East Asia.\n\nMost of the world still drills, digs or grows.\n\nWhat does your country sell most? 👇\n\nNot just you (The map shows each country's single biggest export in 2018, grouped into four types. One product isn't the whole economy, and services like tourism aren't included.)\n\nSource: UNCTAD, The State of Commodity Dependence 2023; CEPII BACI trade data via Visual Capitalist", "date": "2026-11-27", "time": "18:30"}, {"no": 144, "title": "BEST COUNTRY?", "caption": "The best country to live in changes with every thing you count. 🌍\n\nWe compared 89 countries on five things:\n\n☀️ Best weather: Uruguay, Malta, Portugal\n🛡️ Safest: UAE, Qatar, Taiwan\n🛒 Cheapest food: Pakistan, India, Iran\n💰 Most buying power from a salary: Kuwait, Qatar, Switzerland\n🏠 Cheapest rent: Bangladesh, Pakistan, India\n\nA different number one every time. The best place depends on what matters to you.\n\nWhich of the five matters most to you? 👇\n\nNot just you (Numbeo data is crowd-sourced from users, mostly city dwellers, so treat it as a rough guide. Only 89 countries have all five values.)\n\nSource: Numbeo, Quality of Life & Cost of Living Index by Country, 2026 Mid-Year", "date": "2026-11-27", "time": "21:30"}, {"no": 145, "title": "AFFAIRS, WORLDWIDE", "caption": "Is having an affair always wrong? Depends on where you ask. 🌍\n\nOver 30,000 people in 25 countries were asked if it's morally unacceptable.\n\nIndonesia and Turkey: 92% say yes.\nThe US: 90%.\nFrance: 53%. Germany: 55%. Barely half.\n\nSo what counts as a dealbreaker depends a lot on where you grew up.\n\nWhere would your country land? 👇\n\nNot just you (Survey from 2025. The other answers were \"morally acceptable\" or \"not a moral issue\". Countries in grey weren't part of the survey.)\n\nSource: Pew Research Center (2026), 25-country survey on morality", "date": "2026-11-28", "time": "09:00"}, {"no": 146, "title": "CLICHÉ CHECK: JAPAN 2.0", "caption": "Japan judges an affair more mildly than its neighbors. 🇯🇵\n\nIn a 2025 survey, 65% of Japanese called an affair morally wrong.\nIn South Korea it was 83%. In the US, 90%.\n\nAt home, nearly half of married people in Japan had no sex in the past month.\n\nWhat marriage means, and what it allows, really depends on the country.\n\nWhat surprised you more? 👇\n\nNot just you (Two different surveys. \"No sex in the past month\" is how the Japan Family Planning Association defines a sexless marriage. A commercial survey from 2024 even reports 64%.)\n\nSource: Pew Research Center (2026); Japan Family Planning Association (2023 survey, via Japan Times)", "date": "2026-11-28", "time": "12:30"}, {"no": 147, "title": "HOW MANY FRIENDS?", "caption": "How many close friends is normal? Fewer than you think. 🫂\n\nIn 2021, Americans were asked to count their close friends.\n\nAlmost half have one to four.\nOne in eight has none.\nIn 1990, a third had ten or more. Now, only 13%.\n\nIf your circle feels small, you have the most common size there is.\n\nHow many do you have? 👇\n\nNot just you (US survey from 2021, during the pandemic. The 1990 numbers come from Gallup. \"Five to nine\" is the rest.)\n\nSource: Survey Center on American Life (2021); Gallup (1990)", "date": "2026-11-28", "time": "18:30"}, {"no": 148, "title": "MIDDLE CLASS?", "caption": "Are you middle class? Here's where the line is. 💵\n\nResearchers call it middle income if a household earns two thirds to double the typical income.\n\nFor a family of three: about $57,000 to $170,000 a year.\nHalf of all US adults are inside. 28% below, 19% above.\n\nSo the middle isn't one number. It's a wide band, and most people are in it.\n\nWhere do you land? 👇\n\nNot just you (US data for 2022. The band changes with household size and local prices. Pew has a calculator for your exact case.)\n\nSource: Pew Research Center (2024), The State of the American Middle Class", "date": "2026-11-28", "time": "21:30"}, {"no": 149, "title": "MONEY IN THE BANK", "caption": "How much money does a normal American under 35 have in the bank? 🏦\n\nThe Federal Reserve checked: checking, savings, the lot.\n\nThe average: about $20,500.\nBut the person in the middle has just $5,400.\nA few big accounts pull the average up.\n\nSo if your account looks small next to the average, compare it to the middle instead.\n\nWhere do you stand? 👇\n\nNot just you (Per household, by age of the head of household, 2022. Doesn't include retirement accounts or investments. Bars are schematic.)\n\nSource: Federal Reserve, Survey of Consumer Finances 2022", "date": "2026-11-29", "time": "09:00"}, {"no": 150, "title": "HAPPINESS BY AGE 2.0", "caption": "Life satisfaction falls until your late forties. Then it climbs back. 📈\n\nOver 4,000 adults in Scotland rated their life from 0 to 10.\n\nEarly twenties: 8.1\nAround fifty: 7.5\nLate sixties: back up to 7.9\n\nAcross 132 countries, the low point is around age 48.\nThe dip is small, but real.\n\nSo if midlife feels heavy, you're right on schedule. And it tends to lift.\n\nWhere are you on the curve? 👇\n\nNot just you (These are averages across different age groups, not the same people over time. Some long-term studies find a weaker dip or none at all.)\n\nSource: Scottish Health Survey 2016; Blanchflower (2021), Journal of Population Economics", "date": "2026-11-29", "time": "12:30"}, {"no": 151, "title": "BLACK FRIDAY", "caption": "Is Black Friday really the cheapest day of the year? 🛒\n\nA consumer group tracked 208 Black Friday deals, every day for a whole year.\n\nOnly 5 were cheapest on Black Friday itself. That's 2%.\nThe other 98% were just as cheap, or cheaper, on another day.\n\n➡️ Verdict: false.\n\nSo before you buy, check the price history, not the countdown.\n\nWhat are you buying this Black Friday? 👇\n\nNot just you (UK study: 8 big retailers, Black Friday 2022, prices tracked six months before and after. Even counting the whole two weeks around Black Friday, 86% were cheaper or the same at another time.)\n\nSource: Which? (2023), Only 2% of discounted products are cheapest on Black Friday", "date": "2026-11-27", "time": "09:00"}, {"no": 152, "title": "THE BIRTHDAY RIDDLE", "caption": "How many people need to be in a room for a 50/50 chance that two share a birthday? 🎂\n\nLock in your answer before the reveal. 👀\n\nThe real answer: just 23.\n\nWhy? Everyone gets compared with everyone. 23 people make 253 pairs, and every pair is a chance for a match.\nAt 70 people, a match is almost certain (99.9%).\n\nIf you guessed way higher, your gut counted people, not pairs.\n\nWhat did you guess? 👇\n\nNot just you (Math with 365 equally likely birthdays, no leap day, no twins. Real birthdays are slightly uneven, which makes a match a little more likely.)\n\nSource: The birthday problem, standard probability (e.g. Feller, An Introduction to Probability Theory)", "date": "2026-11-29", "time": "21:30"}, {"no": 153, "title": "HUMANITY ON AN ISLAND", "caption": "Give every human alive one square meter. How much land do we need? 🌍\n\nLock in your answer before the reveal. 👀\n\n8.2 billion people × 1 m² = 8,200 km².\nThat's Crete (8,336 km²). All of humanity fits on one Greek island, just barely.\n\nEarth has about 18,000 times more land than that.\n\nSpace isn't the problem. Food, water and energy are.\n\nWhat did you guess? 👇\n\nNot just you (1 m² per person standing, not living space. World population mid-2026 ≈ 8.2 billion.)\n\nSource: U.S. Census Bureau, International Database (2026); Crete area 8,336 km²", "date": "2026-11-30", "time": "09:00"}, {"no": 154, "title": "LIFE EXPECTANCY", "caption": "How long did people in England live? Here are 475 years. ⏳\n\n1541: 38 years.\n1558: 14 years (a flu epidemic).\n1665: 23 years (the Great Plague).\nFor three centuries, it hovered around forty.\n\nThen, in about 150 years, it doubled: 41 in 1870, 81 today.\n\nNot because old people got older, but because children stopped dying.\n\nWhich year surprised you most? 👇\n\nNot just you (Life expectancy at birth. The low numbers were driven mostly by infant and child deaths. Adults who made it through childhood often lived into their 60s. Early centuries: England estimates.)\n\nSource: Gapminder, UN, IHME via Our World in Data (life expectancy at birth, United Kingdom, 1541–2016)", "date": "2026-11-30", "time": "12:30"}, {"no": 155, "title": "MURDER RATES", "caption": "How violent was medieval Europe? Here are 700 years of murder rates. 🗡️\n\nItaly around 1300–1450: 56 to 73 killings per 100,000 people, every year.\nThen, century by century, it kept falling.\nToday: below 1. About 60 times lower.\n\nGermany & Switzerland: 37 → 0.8. England: 23 → 0.5.\n\nYour ancestors didn't just live shorter lives. They lived far more dangerous ones.\n\nWhich century would you have survived? 👇\n\nNot just you (Historical rates are estimates from court and coroner records for selected regions, so they're rough. But every region shows the same long decline.)\n\nSource: Eisner (2003), Long-Term Historical Trends in Violent Crime; IHME (from 1990), via Our World in Data", "date": "2026-11-30", "time": "18:30"}, {"no": 156, "title": "ALL THE GOLD", "caption": "All the gold in the world, melted into one cube. How big is it? 🪙\n\nLock in your answer before the reveal. 👀\n\n224,200 tonnes: every ring, coin and bar ever made.\nIt's a cube about 23 meters wide. As tall as a seven-story building.\nThousands of years of gold rushes, standing on two tennis courts.\nWorth about 30 trillion dollars.\n\nGold isn't valuable because there's a lot of it. It's valuable because there's so little.\n\nWhat did you guess? 👇\n\nNot just you (Above-ground stocks end of Q3 2026, rounded. The value moves with the gold price.)\n\nSource: World Gold Council, How much gold has been mined? (2026)", "date": "2026-11-30", "time": "21:30"}, {"no": 157, "title": "YOUR FIELD", "caption": "How much farmland does it take to feed one person? Guess the size. 🌾\n\nLock in your answer before the reveal. 👀\n\nAll the farmland on Earth, split evenly: about 5,900 m² each.\nAlmost a whole football pitch.\n\n80% of it feeds animals: pasture and feed crops.\nBut that part gives us only 17% of our calories.\n\nMost of the field feeds animals. The small corner feeds most of us.\n\nDid you guess bigger or smaller? 👇\n\nNot just you (Global averages. Animal products give 17% of calories but 38% of protein. 4% of farmland grows non-food crops like cotton and biofuels.)\n\nSource: Our World in Data (2024), based on UN FAO and Poore & Nemecek (2018)", "date": "2026-12-01", "time": "09:00"}, {"no": 158, "title": "THE PRICE OF LIGHT", "caption": "How expensive was light? Here are 700 years of prices in England. 🕯️\n\nIn 1300, light cost over 10,000 times more than today.\nFor five hundred years, the price barely moved.\nThen came gas lamps, kerosene and the light bulb.\n\n1300: £33,000 per million lumen-hours. 2006: under £3. (In 2000 pounds, inflation-adjusted.)\n\nFor most of history, darkness was the cheap option.\n\nWould you have gone to bed at sunset? 👇\n\nNot just you (A million lumen-hours is roughly one bright bulb running for 1,250 hours. The price is the average across candles, oil, gas and electricity.)\n\nSource: Fouquet & Pearson (2006), Seven Centuries of Energy Services, via Our World in Data", "date": "2026-12-01", "time": "12:30"}, {"no": 159, "title": "CHILD MORTALITY", "caption": "How many children died before their fifth birthday? The whole world, since 1800. 👶\n\n1800: 43 out of 100.\n1900: still more than 1 in 3.\nThen came vaccines, clean water and antibiotics.\nToday: about 4 out of 100.\n\nThat's the real reason life expectancy doubled.\n\nDid you know it was this high? 👇\n\nNot just you (Historical numbers before 1950 are estimates. 4 out of 100 is still millions of children a year, mostly from preventable causes.)\n\nSource: Gapminder and World Bank (2019), via Our World in Data", "date": "2026-12-01", "time": "18:30"}, {"no": 160, "title": "HOW TALL?", "caption": "How tall were German men 200 years ago? Here's every generation. 📏\n\nBorn around 1850: 1.64 m on average.\nThen, generation by generation, they grew.\nBorn in 1980: 1.80 m. 17 cm taller.\n\nSame genes. Better food, cleaner water and fewer childhood illnesses.\n\nHow much taller are you than your grandparents? 👇\n\nNot just you (Men only, by year of birth. Historical data comes from soldiers and conscripts, so it's an estimate.)\n\nSource: University of Tübingen, Baten & Blum (2015), Human Height, via Our World in Data", "date": "2026-12-01", "time": "21:30"}, {"no": 161, "title": "WHO COULD READ?", "caption": "How many people in the world could read? Here's every decade since 1820. 📖\n\n1820: 12 out of 100.\n1950: just over half.\nToday: 86 out of 100.\n\nThat you can read this was, for most of history, a rare privilege.\n\nWho taught you to read? 👇\n\nNot just you (Adults 15+. Historical values are estimates, and \"literate\" was measured differently over time. Around 750 million adults still can't read today.)\n\nSource: Our World in Data, based on OECD (2014) and UNESCO", "date": "2026-12-02", "time": "09:00"}];
const state = {};            // "nj06" -> {tiktok:bool, ig:bool}
let filter = 'plan', query = '', db = null, col = null, mode = 'local';
const pad = n => String(n).padStart(2,'0');
const id = e => 'nj' + pad(e.no);
const $ = s => document.querySelector(s);
const DOW = ['So','Mo','Di','Mi','Do','Fr','Sa'];
function fmtDay(d){ if(!d) return 'Nicht im Instagram-Plan'; const [y,m,dd]=d.split('-').map(Number); const dt=new Date(y,m-1,dd); return DOW[dt.getDay()]+' '+pad(dd)+'.'+pad(m)+'.'; }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),1400); }
function loadLocal(){ try{ const s=JSON.parse(localStorage.getItem('njy-posted')||'{}'); Object.assign(state,s); }catch(e){} }
function saveLocal(){ try{ localStorage.setItem('njy-posted', JSON.stringify(state)); }catch(e){} }
const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

let sortBy = 'date-asc';
try{ sortBy = localStorage.getItem('njy-sort') || 'date-asc'; }catch(e){}
const isDone = e => { const st = state[id(e)]||{}; return !!(st.tiktok && (st.ig || e.date)); };
function sorted(rows){
  const dk = e => e.date ? e.date + e.time : '9999';
  const f = { 'date-asc': (a,b)=> dk(a).localeCompare(dk(b)) || a.no-b.no,
              'date-desc': (a,b)=> dk(b).localeCompare(dk(a)) || b.no-a.no,
              'no-asc': (a,b)=> a.no-b.no, 'no-desc': (a,b)=> b.no-a.no }[sortBy] || ((a,b)=>a.no-b.no);
  return rows.slice().sort(f);
}
function card(e){
  const st = state[id(e)]||{};
  const el = document.createElement('article'); el.className='ep';
  el.innerHTML = `<a href="${BASE+id(e)}.mp4" target="_blank" rel="noopener"><img loading="lazy" alt="" src="thumbs/${id(e)}.jpg"></a>
    <div><div class="top"><div><div class="no">No. ${pad(e.no)}</div><div class="t"></div><div class="when">${e.date? fmtDay(e.date)+' · IG auto · '+e.time : 'nicht eingeplant'}</div></div>
    <div class="checks">
      <label class="ck"><input type="checkbox" data-k="tiktok" ${st.tiktok?'checked':''}><div class="box">${CHECK}</div><span>TikTok</span></label>
      <label class="ck"><input type="checkbox" data-k="ig" ${st.ig?'checked':''}><div class="box">${CHECK}</div><span>IG manuell</span></label>
    </div></div>
    <div class="acts"><a class="btn p" href="${BASE+id(e)}.mp4" target="_blank" rel="noopener">Video öffnen</a>
      <button class="btn" data-copy>Caption kopieren</button>
      <a class="btn" href="${BASE+id(e)}.jpg" target="_blank" rel="noopener">Cover</a></div>
    <details><summary>Caption anzeigen</summary><pre></pre></details></div>`;
  el.querySelector('.t').textContent = e.title;
  el.querySelector('pre').textContent = e.caption;
  el.querySelector('[data-copy]').onclick = ()=>copy(e.caption);
  el.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange=()=>toggle(e, cb.dataset.k, cb.checked));
  return el;
}
function fill(host, rows, headers){
  let lastDay = null;
  for(const e of rows){
    if(headers){ const day = fmtDay(e.date); if(day!==lastDay){ const h=document.createElement('div'); h.className='day'; h.textContent=day; host.appendChild(h); lastDay=day; } }
    host.appendChild(card(e));
  }
}
function render(){
  const list = $('#list'); const wasOpen = !!(list.querySelector('.donebox')||{}).open; list.innerHTML='';
  let rows = EPS.slice();
  if(filter==='plan') rows = rows.filter(e=>e.date);
  if(query){ const q=query.toLowerCase(); rows = rows.filter(e=>String(e.no).includes(q)||e.title.toLowerCase().includes(q)||e.caption.toLowerCase().includes(q)); }
  rows = sorted(rows);
  const open = rows.filter(e=>!isDone(e)), done = rows.filter(isDone);
  const byDate = sortBy.startsWith('date');
  if(!open.length){ list.innerHTML='<div class="empty">Nichts offen. Stark.</div>'; }
  fill(list, open, byDate);
  if(done.length){
    const box = document.createElement('details'); box.className='donebox'; box.open = wasOpen;
    box.innerHTML = `<summary>Gepostet (${done.length})</summary>`;
    fill(box, done, false); list.appendChild(box);
  }
  const all = EPS.length, tt = EPS.filter(e=>(state[id(e)]||{}).tiktok).length, ig = EPS.filter(e=>(state[id(e)]||{}).ig).length;
  $('#sTT').textContent = tt+' / '+all; $('#sIG').textContent = ig; $('#sAll').textContent = all;
}
function a_or(r){ return r.length>0; }
async function copy(t){
  try{ await navigator.clipboard.writeText(t); toast('Caption kopiert'); }
  catch(err){ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove(); toast(ok?'Caption kopiert':'Kopieren blockiert – Caption aufklappen'); }
}
async function toggle(e, k, v){
  const key = id(e); const prev = Object.assign({}, state[key]||{});
  state[key] = Object.assign({}, prev, {[k]: v}); render();
  if(mode==='db'){
    try{ await col.doc(key).set({tiktok: !!state[key].tiktok, ig: !!state[key].ig, no: e.no, updatedAt: new Date().toISOString()}); }
    catch(err){ state[key]=prev; render(); toast('Nicht gespeichert'); }
  } else { saveLocal(); }
}
document.querySelectorAll('.f').forEach(b=>b.onclick=()=>{ filter=b.dataset.f; document.querySelectorAll('.f').forEach(x=>x.setAttribute('aria-pressed', x===b)); render(); });
$('#q').oninput = ev => { query = ev.target.value.trim(); render(); };
$('#sort').value = sortBy;
$('#sort').onchange = ev => { sortBy = ev.target.value; try{ localStorage.setItem('njy-sort', sortBy); }catch(e){} render(); };

loadLocal(); render();
$('#sync').textContent = 'Nur in diesem Browser gespeichert.';
(async()=>{
  try{ db = window.claude && window.claude.use ? await window.claude.use('db') : null; }catch(e){ db=null; }
  if(!db) return;
  col = db.collection('posted'); mode='db';
  $('#sync').textContent = 'Synchronisiert auf allen Geräten.';
  col.onSnapshot(snap=>{
    for(const k of Object.keys(state)) delete state[k];
    snap.docs.forEach(d=>{ const v=d.data()||{}; state[d.id]={tiktok:!!v.tiktok, ig:!!v.ig}; });
    render();
  }, err=>{ $('#sync').textContent='Sync nicht verfügbar – Änderungen werden evtl. nicht gespeichert.'; });
})();
</script></body></html>
