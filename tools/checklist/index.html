<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not just you Posting</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;700&family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafaf8;--card:#fff;--ink:#0c0c0c;--mid:#77776f;--rule:#e2e2de;--sig:#ff4000;--sig-ink:#fff;--ok:#0c0c0c;--chip:#efefeb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0d;--card:#171716;--ink:#f2f2ee;--mid:#8c8c86;--rule:#2a2a28;--sig:#ff5a1f;--sig-ink:#fff;--ok:#f2f2ee;--chip:#222220}}
:root[data-theme="dark"]{--bg:#0e0e0d;--card:#171716;--ink:#f2f2ee;--mid:#8c8c86;--rule:#2a2a28;--sig:#ff5a1f;--sig-ink:#fff;--ok:#f2f2ee;--chip:#222220}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 80px}
h1{font:900 clamp(34px,8vw,56px)/.95 Roboto,sans-serif;letter-spacing:-.02em;margin:0 0 6px;text-transform:uppercase}
h1 span{color:var(--sig)}
.sub{font:500 14px 'Roboto Condensed',sans-serif,sans-serif;color:var(--mid);text-transform:uppercase;letter-spacing:.06em;margin-bottom:22px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat{border-top:4px solid var(--ink);padding:8px 2px 0;min-width:120px;flex:1}
.stat b{display:block;font:900 30px/1 Roboto,sans-serif;font-variant-numeric:tabular-nums}
.stat.s b{color:var(--sig)}.stat.s{border-color:var(--sig)}
.stat small{font:500 12px 'Roboto Condensed',sans-serif;color:var(--mid);text-transform:uppercase;letter-spacing:.06em}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--rule);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.f{border:0;background:var(--chip);color:var(--ink);font:700 13px 'Roboto Condensed',sans-serif;text-transform:uppercase;letter-spacing:.05em;padding:8px 12px;border-radius:999px;cursor:pointer}
.f[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.q{flex:1;min-width:140px;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:400 14px Roboto,sans-serif}
.note{font-size:12px;color:var(--mid);margin:10px 0 0}
.sel{flex:0 1 auto;min-width:0;cursor:pointer;appearance:auto}
.donebox{margin-top:30px;border-top:4px solid var(--ink);padding-top:6px}
.donebox>summary{font:900 20px Roboto,sans-serif;text-transform:uppercase;color:var(--ink);letter-spacing:-.01em;padding:8px 0;list-style:none}
.donebox>summary::-webkit-details-marker{display:none}
.donebox>summary::before{content:'+ ';color:var(--sig)}
.donebox[open]>summary::before{content:'– '}
.donebox .ep{opacity:.6}
.day{font:700 13px 'Roboto Mono',monospace,monospace;color:var(--mid);margin:26px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.ep{display:grid;grid-template-columns:72px 1fr;gap:14px;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:12px;margin-bottom:10px}
.ep.done{opacity:.55}
.ep img{width:72px;height:128px;object-fit:cover;border-radius:6px;background:var(--chip);display:block}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.no{font:500 12px 'Roboto Mono',monospace;color:var(--sig)}
.t{font:900 19px/1.15 Roboto,sans-serif;text-transform:uppercase;margin:2px 0 4px;letter-spacing:-.01em}
.when{font:500 12px 'Roboto Mono',monospace;color:var(--mid)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);color:var(--ink);background:none;font:700 12px 'Roboto Condensed',sans-serif;text-transform:uppercase;letter-spacing:.05em;padding:7px 11px;border-radius:6px;cursor:pointer;text-decoration:none}
.btn.p{background:var(--sig);border-color:var(--sig);color:var(--sig-ink)}
.checks{display:flex;gap:6px;flex-shrink:0}
.ck{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;user-select:none}
.ck input{position:absolute;opacity:0;pointer-events:none}
.box{width:34px;height:34px;border:2px solid var(--mid);border-radius:8px;display:grid;place-items:center;transition:.12s}
.box svg{width:20px;height:20px;stroke:var(--sig-ink);stroke-width:3;fill:none;opacity:0}
.ck input:checked+.box{background:var(--sig);border-color:var(--sig)}
.ck input:checked+.box svg{opacity:1}
.ck input:focus-visible+.box{outline:2px solid var(--ink);outline-offset:2px}
.ck span{font:700 10px 'Roboto Condensed',sans-serif;text-transform:uppercase;color:var(--mid);letter-spacing:.05em}
details{margin-top:8px}summary{cursor:pointer;font:500 12px 'Roboto Condensed',sans-serif;text-transform:uppercase;color:var(--mid);letter-spacing:.05em}
pre{white-space:pre-wrap;font:400 13px/1.45 Roboto,sans-serif;background:var(--chip);padding:10px;border-radius:6px;margin:8px 0 0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font:700 13px 'Roboto Condensed',sans-serif;text-transform:uppercase;padding:10px 16px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.empty{color:var(--mid);padding:30px 0;text-align:center}
@media (max-width:480px){.ep{grid-template-columns:56px 1fr}.ep img{width:56px;height:100px}.t{font-size:16px}.box{width:30px;height:30px}}

<script>
const BASE = "https://chris61ds-alt.github.io/notjustyou-media/";
const EPS = [{"no": 6, "title": "LIKING GAP", "caption": "That conversation you keep replaying in your head? 🔁\n\nResearchers paired strangers for a 5-minute chat. Afterwards, both rated how much they liked the other person, and how much they thought the other person liked them.\n\nOn average, people were liked more than they thought. Researchers call it the liking gap.\n\nWhy? We're so busy judging ourselves that we miss the signs the other person is enjoying it.\n\nAmong new college roommates, the gap lasted for months.\n\nSo next time you replay it: they probably liked you more than you think.\n\nNot just you. 💜\n\nSource: Boothby, Cooney, Sandstrom & Clark (2018), Psychological Science 29(11)\n\nSend this to the friend who overthinks every conversation.", "date": "", "time": ""}, {"no": 7, "title": "THE BEAUTIFUL MESS", "caption": "Still cringing about the thing you admitted? 🫣\n\nIn seven studies, people pictured moments of vulnerability: admitting a mistake, confessing their love, improvising a song in front of a jury.\n\nWhen it was them, it looked more like weakness.\nWhen it was someone else, it looked more like courage.\n\nResearchers call it the beautiful mess effect. Up close, you see every messy detail. From the outside, people see the whole picture.\n\nAnd follow-up studies found: people who are kinder to themselves show a smaller gap.\n\nSo that moment you're cringing about? To them, it might have looked brave. 🧡\n\nNot just you.\n\nSources: Bruk, Scholl & Bless (2018), Journal of Personality and Social Psychology · Bruk, Scholl & Bless (2022), Personality and Social Psychology Bulletin\n\nSend this to someone who just did something brave.", "date": "", "time": ""}, {"no": 8, "title": "THE END OF HISTORY", "caption": "Who were you ten years ago? 🕰️\n\nDifferent person, right? Now think ten years ahead. You'll stay pretty much the same… right?\n\nResearchers asked over 19,000 people aged 18 to 68. At every age, people said they had changed a lot in the past decade, and predicted they would change very little in the next.\n\nPsychologists call it the end of history illusion.\n\nPeople would pay about $80 to see their favorite band from ten years ago. But about $129 to see today's favorite, ten years from now.\n\n\"At every age we think we're having the last laugh, and at every age we're wrong.\" – Daniel Gilbert\n\nSo the person you are right now? Not the final version. 🧡\n\nNot just you.\n\nSource: Quoidbach, Gilbert & Wilson (2013), Science · via The New York Times\n\nTell me: what changed most about you in the last ten years?", "date": "", "time": ""}, {"no": 9, "title": "FUTURE YOU", "caption": "Your brain thinks future you is a stranger. 🧠\n\nIn a brain scan study, people thought about themselves now, themselves in ten years, and another person. Thinking about future you looked a lot like thinking about someone else.\n\nAnd the bigger that gap, the worse people were at saving.\n\nSo researchers let people meet their future self: an aged version of their own face, in virtual reality. Afterwards, they put about twice as much into a pretend retirement account.\n\nNext time it's now versus later, picture future you. Not a stranger. You. 🧡\n\nNot just you.\n\nSources: Ersner-Hershfield, Wimmer & Knutson (2009), Social Cognitive and Affective Neuroscience · Hershfield et al. (2011), Journal of Marketing Research\n\nSave this for your next \"I'll deal with it later\" moment.", "date": "", "time": ""}, {"no": 10, "title": "THE SPOTLIGHT", "caption": "Spilled coffee on your shirt and felt like everyone was staring? ☕\n\nResearchers made students wear an embarrassing T-shirt with a giant picture of Barry Manilow into a room full of people.\n\nAfterwards, the students guessed about half the room had noticed. The real number? About a quarter.\n\nPsychologists call it the spotlight effect. You're the center of your own world. But everyone else is busy being the center of theirs.\n\nSo that coffee stain? Most people never even saw it. 🧡\n\nNot just you.\n\nSource: Gilovich, Medvec & Savitsky (2000), Journal of Personality and Social Psychology\n\nSend this to someone who's still thinking about that one moment.", "date": "", "time": ""}, {"no": 11, "title": "SAY IT", "caption": "You thought something nice about someone. And didn't say it. 🤐\n\nMaybe it felt awkward. Or not good enough.\n\nResearchers had people write compliments to someone close, then predict how that person would feel. They underestimated how good it felt. And overestimated how awkward it was.\n\nThe wording barely mattered. The warmth did.\n\nSo say it. It lands better than you think. 🧡\n\nNot just you.\n\nSource: Zhao & Epley (2021), Journal of Personality and Social Psychology\n\nWho's getting your compliment today? Tag them.", "date": "", "time": ""}, {"no": 12, "title": "FRESH START", "caption": "Why does everything start on a Monday? 📅\n\nGoogle searches for \"diet\" spike at the start of every week, every month and every year. Students hit the gym more at the start of a week, a new semester, and right after their birthday.\n\nIt's called the fresh start effect. A new date feels like a new chapter. Old slip-ups feel like they belong to the last one.\n\nAnd it works on demand: calling March 20 \"the first day of spring\" instead of \"the third Thursday in March\" made people more likely to start (26% vs. 7% signed up for goal reminders).\n\nSo missed Monday? Find another first day. 🧡\n\nNot just you.\n\nSources: Dai, Milkman & Riis (2014), Management Science · Dai, Milkman & Riis (2015), Psychological Science\n\nWhat's your next \"first day\"? Comment it.", "date": "", "time": ""}, {"no": 13, "title": "THE GOOD ENDING", "caption": "People chose more pain over less. Voluntarily. 🧊\n\nIn a classic experiment, people held one hand in painfully cold water (14 °C) for 60 seconds. The other hand got the same 60 seconds, plus 30 more while the water got slightly warmer.\n\nWhich one would they repeat? Most chose the longer one (22 of 32).\n\nMemory doesn't add up the minutes. It keeps the worst moment and the ending. Psychologists call it the peak-end rule.\n\nSo want a good memory? Give it a good ending. 🧡\n\nNot just you.\n\nSource: Kahneman, Fredrickson, Schreiber & Redelmeier (1993), Psychological Science\n\nWhat's the best ending you remember? Tell me.", "date": "", "time": ""}, {"no": 14, "title": "LOOK UP", "caption": "You filmed the whole concert. Now try to remember it. 📱\n\nIn a museum study, students looked at some objects and photographed others. The next day, they remembered the photographed ones worse.\n\nPsychologists call it the photo-taking impairment effect. One idea: your brain hands the job to the camera. It's saved, so why remember?\n\nBut here's the twist: zooming in on one detail helped people remember the whole object.\n\nSo take the photo. Then look up, and actually look. 🧡\n\nNot just you.\n\nSource: Henkel (2014), Psychological Science\n\nSave this for your next concert.", "date": "", "time": ""}, {"no": 15, "title": "NEXT IN LINE", "caption": "Round of introductions. Your turn is next. What did the person before you just say? 🤔\n\nNo idea, right?\n\nIn a classic experiment, people took turns reading words aloud. Afterwards, they barely remembered the words read just before their own turn.\n\nIt's called the next-in-line effect. While you rehearse your line, your brain stops recording.\n\nKnowing about it helps: people told to focus on the speaker before them avoided the gap.\n\nSo next round: listen first. Then talk. 🧡\n\nNot just you.\n\nSources: Brenner (1973), Journal of Verbal Learning and Verbal Behavior · Bond (1985)\n\nTag the colleague who always goes right after you.", "date": "", "time": ""}, {"no": 16, "title": "BAKER / BAKER", "caption": "You remember their face. Their job. Their dog. But not their name. 🙃\n\nIn one experiment, people saw a face and were told: \"this man is a baker.\" Others were told: \"his name is Baker.\"\n\nSame word. But the job was remembered far better than the name.\n\nIt's called the Baker/baker paradox. A baker comes with bread, flour and ovens. A name like Baker comes with nothing to hold on to.\n\nSo give names a hook. Picture Mr. Baker holding a loaf of bread. 🍞\n\nNot just you.\n\nSources: McWeeny, Young, Hay & Ellis (1987), British Journal of Psychology · Cohen (1990), British Journal of Psychology\n\nWhat's the trick you use to remember names?", "date": "", "time": ""}, {"no": 17, "title": "NO TICKLE", "caption": "Try to tickle yourself. Nothing, right? 🪶\n\nYour brain predicts the touch before it happens. And what's predicted feels weaker.\n\nResearchers built a robot that stroked people's palm, controlled by their own other hand. When the robot added a tiny delay, just a fraction of a second, it started to tickle.\n\nYour brain cancels out its own surprises. That's why you can't tickle yourself. And why someone else's touch always feels stronger.\n\nNot just you. 🧡\n\nSource: Blakemore, Frith & Wolpert (1999), Journal of Cognitive Neuroscience\n\nDid you just try it? Be honest.", "date": "", "time": ""}, {"no": 18, "title": "PHANTOM BUZZ", "caption": "Your phone just buzzed. It didn't. 📳\n\nIn one survey, almost nine out of ten students had felt a phantom vibration. For most, it happens every now and then. And most don't find it bothersome.\n\nYour brain is on alert for one signal. So it reads a twitch, or your shirt, as a buzz.\n\nResearchers call it a tactile hallucination. And it's incredibly common.\n\nYour brain isn't broken. It's just listening too hard. 🧡\n\nNot just you.\n\nSources: Drouin, Kaiser & Miller (2012), Computers in Human Behavior · Rothberg et al. (2010), BMJ\n\nHow many times did you check your phone while watching this?", "date": "", "time": ""}, {"no": 19, "title": "BRAIN FREEZE", "caption": "One spoon of ice cream. And your forehead explodes. 🍦\n\nIn a study published in the BMJ, students ate ice cream either fast, or slowly. Eating fast? About 27% got a brain freeze. Slowly? About 12%.\n\nThe cold hits the roof of your mouth. But the pain shows up in your forehead. That's called referred pain.\n\nThe fix: press your tongue against the roof of your mouth to warm it up.\n\nSo your brain isn't freezing. The pain just went to the wrong address. 🧡\n\nNot just you.\n\nSource: Kaczorowski & Kaczorowski (2002), BMJ\n\nTeam fast or team slow?", "date": "", "time": ""}, {"no": 20, "title": "FIRST NIGHT", "caption": "First night in a hotel. And you sleep terribly. 🛏️\n\nResearchers measured people's brains during their first night in a new place. One half of the brain, the left, stayed more alert than the other.\n\nIt reacted more to strange sounds. And woke people up faster. By the second night, the difference was gone.\n\nIt's called the first-night effect. A built-in night watch. 🧡\n\nNot just you.\n\nSource: Tamaki, Bang, Watanabe & Sasaki (2016), Current Biology\n\nSend this to your travel buddy who never sleeps on night one.", "date": "", "time": ""}, {"no": 21, "title": "SLEEP ON IT", "caption": "Stuck on a problem? Go to bed. 😴\n\nIn one experiment, people practised a number puzzle that had a hidden shortcut. After a night of sleep, more than twice as many found the shortcut as people who stayed awake.\n\nBut only if they had worked on the puzzle first.\n\nSo sleeping on it isn't giving up. It's part of the work. 🧡\n\nNot just you.\n\nSource: Wagner, Gais, Haider, Verleger & Born (2004), Nature\n\nWhat's the best idea you ever woke up with?", "date": "", "time": ""}, {"no": 22, "title": "BAD NIGHT", "caption": "Bad night? You might push people away. Literally. 😵‍💫\n\nIn one study, after a sleepless night, people stopped approaching strangers sooner. They kept others about 18 to 60% farther away.\n\nAnd over a thousand online viewers, who didn't know, rated them as lonelier. Even worse: watching them made the viewers feel a little lonelier themselves.\n\nSo before you decide nobody likes you, maybe just sleep. 🧡\n\nNot just you.\n\nSource: Ben Simon & Walker (2018), Nature Communications\n\nTag someone who needs to hear this tonight.", "date": "", "time": ""}, {"no": 23, "title": "SLOW MOTION", "caption": "In a crash, time slows down. Right? ⏱️\n\nResearchers dropped volunteers about 30 meters into a net. Free fall. Afterwards, they guessed their own fall had lasted about a third longer than other people's.\n\nBut during the fall, they watched a display flashing numbers too fast to read. If time really slowed, they could read them. They couldn't.\n\nFear makes memory record more detail. And more memory feels like more time. 🧡\n\nNot just you.\n\nSource: Stetson, Fiesta & Eagleman (2007), PLoS ONE\n\nHave you ever had a \"slow-motion\" moment?", "date": "", "time": ""}, {"no": 24, "title": "TWO DAYS", "caption": "\"This will take two days.\" Famous last words. 🗓️\n\nStudents guessed how long their thesis would take. On average: about 34 days. Even their worst-case guess was 49 days. The real average: 55. Only about three in ten finished on time.\n\nIt's called the planning fallacy. We picture the plan. Not the interruptions.\n\nThe fix: check how long it took last time. Not how long it should take. 🧡\n\nNot just you.\n\nSource: Buehler, Griffin & Ross (1994), Journal of Personality and Social Psychology\n\nWhat's the \"two-day task\" that took you two weeks?", "date": "", "time": ""}, {"no": 25, "title": "THE HOUR BEFORE", "caption": "Meeting in an hour? Then you can't really start anything. ⏳\n\nResearchers gave people the same free time. Some of them had an appointment coming up. Those people felt they had about ten minutes less. And in the lab, students reminded of an upcoming task got less done.\n\nTime before a deadline feels shorter than it is.\n\nSo batch your meetings. And count the real minutes. 🧡\n\nNot just you.\n\nSource: Tonietto, Malkoc & Nowlis (2019), Journal of Consumer Research\n\nSave this for your next calendar cleanup.", "date": "", "time": ""}, {"no": 26, "title": "TAP TO PAY", "caption": "Why does paying by card feel like nothing? 💳\n\nIn one experiment, people bid on tickets to a sold-out basketball game. Some had to pay cash. Others, by card. The card group was willing to pay more than twice as much.\n\nResearchers call it the pain of paying. Cash hurts. Cards numb it.\n\nWant to spend less? Make it hurt a little. Pay cash, or check your balance first. 🧡\n\nNot just you.\n\nSource: Prelec & Simester (2001), Marketing Letters\n\nCash or card: what's your weakness?", "date": "", "time": ""}, {"no": 27, "title": "BREAK THE FIFTY", "caption": "You break a fifty. And somehow it's gone by Friday. 💸\n\nIn one experiment, people got five dollars. Either as one bill, or as five ones or coins. Those with small change spent more. The single bill mostly stayed in the pocket.\n\nIt's called the denomination effect. A big bill feels too whole to break.\n\nSo want to save? Keep it in one piece. 🧡\n\nNot just you.\n\nSource: Raghubir & Srivastava (2009), Journal of Consumer Research\n\nAre you a \"break it immediately\" person?", "date": "", "time": ""}, {"no": 28, "title": "THE WAITING", "caption": "Waiting for a new phone feels like impatience. Waiting for a trip feels like happiness. ✈️\n\nResearchers pinged over 2,000 people at random moments and asked what they were thinking about. People looking forward to an experience were happier than people looking forward to a thing.\n\nEven news reports agreed: people in line for experiences were in better moods than people in line for stuff.\n\nSo book the trip early. The waiting is part of the gift. 🧡\n\nNot just you.\n\nSource: Kumar, Killingsworth & Gilovich (2014), Psychological Science\n\nWhat are you looking forward to right now?", "date": "", "time": ""}, {"no": 29, "title": "EARWORMS", "caption": "That song stuck in your head? It's not random. 🎶\n\nResearchers asked 3,000 people for their most frequent earworms and compared them to equally popular songs. Earworms tend to be faster, with a familiar melodic shape, and one surprising jump or repeat.\n\nThe most named earworm: \"Bad Romance\" by Lady Gaga.\n\nTo get rid of one: listen to it all the way through. Or chew gum. In one study, it helped. 🧡\n\nNot just you.\n\nSources: Jakubowski, Finkel, Stewart & Müllensiefen (2017), Psychology of Aesthetics, Creativity, and the Arts · Beaman et al. (2015), Quarterly Journal of Experimental Psychology\n\nWhich song is stuck in your head right now?", "date": "", "time": ""}, {"no": 30, "title": "CHILLS", "caption": "Goosebumps from a song? Your brain is doing something wild. 🎧\n\nResearchers scanned people while they listened to music that gave them chills. At the peak, their brains released dopamine, the same reward chemical as food.\n\nBut here's the twist: dopamine also flowed before the peak. Just from waiting for it.\n\nSo that build-up before the drop? Your brain is paying you to wait. 🧡\n\nNot just you.\n\nSource: Salimpoor, Benovoy, Larcher, Dagher & Zatorre (2011), Nature Neuroscience\n\nWhich song gives you chills every single time?", "date": "", "time": ""}, {"no": 31, "title": "SAD SONGS", "caption": "Why does sad music feel so good? 🌧️\n\nIn a survey of over 700 people, researchers asked how sad music makes them feel. The most common answer wasn't sadness. It was nostalgia. Then peacefulness, and tenderness.\n\nAnd people reached for it most when they felt lonely or down.\n\nSo sad songs aren't making it worse. They're keeping you company. 🧡\n\nNot just you.\n\nSource: Taruffi & Koelsch (2014), PLOS ONE\n\nDrop your favorite sad song in the comments.", "date": "", "time": ""}, {"no": 32, "title": "SPOON", "caption": "Say the word \"spoon\". Again. Again. Again. 🥄\n\nSpoon. Spoon. Spoon. Spoon. Spoon. Spoon.\n\nAt some point, it stops sounding like a word. It's called semantic satiation, a term coined by a psychologist in 1962.\n\nRepeat a word enough and the link to its meaning gets tired. Like a muscle.\n\nYour brain isn't glitching. It's just tired of spoon. 🧡\n\nNot just you.\n\nSources: Jakobovits (1962), McGill University dissertation · Severance & Washburn (1907), American Journal of Psychology\n\nTry it with your own name. Report back.", "date": "", "time": ""}, {"no": 33, "title": "TIP OF THE TONGUE", "caption": "\"It's on the tip of my tongue.\" 👅\n\nIn a classic study, people read definitions of rare words. When they got stuck, they often still knew the first letter. Or how many syllables.\n\nSo the word is in there. Just not all at once.\n\nAnd it's universal: of 51 languages surveyed, 45 have a phrase for it. (German: \"Es liegt mir auf der Zunge.\")\n\nA small hint, like the first sound, often unlocks it. 🧡\n\nNot just you.\n\nSources: Brown & McNeill (1966), Journal of Verbal Learning and Verbal Behavior · Schwartz (1999), Psychonomic Bulletin & Review\n\nWhat's the word you always forget?", "date": "", "time": ""}, {"no": 34, "title": "BOUBA / KIKI", "caption": "One of these shapes is called Bouba. The other is Kiki. Which is which? 🔵⭐\n\nYou probably said the round one is Bouba. So does almost everyone.\n\nResearchers tested speakers of 25 languages and 10 writing systems. Most matched them the same way.\n\nRound sounds, round lips, round shape. Sharp sounds, sharp shape.\n\nSo language isn't completely random. Some sounds come with a shape. 🧡\n\nNot just you.\n\nSources: Ćwiek et al. (2021), Philosophical Transactions of the Royal Society B · Ramachandran & Hubbard (2001) · Köhler (1929)\n\nDid you pick the same? Tell me in the comments.", "date": "", "time": ""}, {"no": 35, "title": "SWIPE FATIGUE", "caption": "Ten minutes on a dating app, and suddenly nobody looks good? 📱\n\nIn three studies, singles swiped through profiles: yes or no. The longer they swiped, the less often they said yes. They also grew less satisfied, and more pessimistic about their own chances.\n\nResearchers call it a rejection mindset.\n\nSo if everyone starts looking wrong, it might be the swiping. Not them. Take a break. 🧡\n\nNot just you.\n\nSource: Pronk & Denissen (2020), Social Psychological and Personality Science\n\nSend this to the friend who's been swiping since lunch.", "date": "", "time": ""}, {"no": 36, "title": "ASK ONE MORE", "caption": "Want a second date? Ask one more question. ☕\n\nResearchers analysed over 2,000 speed-dating conversations. People who asked more questions got more second dates. Especially follow-up questions, the ones that show you were listening.\n\nThe estimate: one extra question per date, across 20 dates, meant one more \"yes\".\n\nSo less pitching yourself. More: \"wait, tell me more about that.\" 🧡\n\nNot just you.\n\nSource: Huang, Yeomans, Brooks, Minson & Gino (2017), Journal of Personality and Social Psychology\n\nWhat's your go-to first-date question?", "date": "", "time": ""}, {"no": 37, "title": "YOUR TYPE", "caption": "You have a type. Right? 💘\n\nBefore a speed-dating event, people listed what they wanted in a partner. Men said looks mattered more to them. Women said earning potential.\n\nBut at the actual dates, those things mattered about the same for men and women. What people said they wanted had little to do with who they actually liked.\n\nSo maybe your type is just a theory. Go on the date anyway. 🧡\n\nNot just you.\n\nSource: Eastwick & Finkel (2008), Journal of Personality and Social Psychology\n\nHas someone ever completely broken your \"type\"?", "date": "", "time": ""}, {"no": 38, "title": "JUST THINK", "caption": "You'd rather get an electric shock than sit alone with your thoughts. ⚡\n\nResearchers left students alone in an empty room for up to fifteen minutes. No phone. Just their thoughts. Most of them didn't enjoy it.\n\nThen they added a button that gave a mild electric shock, one the students had said they'd pay to avoid.\n\nTwo out of three men pressed it. And one in four women. One man pressed it 190 times.\n\nSo if you grab your phone the second you're alone, you're not weird. Thinking is hard work. 🧡\n\nNot just you.\n\nSource: Wilson et al. (2014), Science\n\nWould you press it? Be honest.", "date": "", "time": ""}, {"no": 39, "title": "YOU LIED TODAY", "caption": "How many lies do you tell per day? Guess. 🤥\n\nIn a diary study, people wrote down every lie they told for a whole week. College students lied about twice a day. Other adults, about once.\n\nThat's one in three conversations for students. One in five for everyone else.\n\nThe most common lies were about feelings: \"I love it.\" \"I'm fine.\" \"Great idea.\" And about twice as many lies protected the liar as protected someone else.\n\nSo next time you say \"I'm fine\", at least you're in good company. 🧡\n\nNot just you.\n\nSource: DePaulo, Kashy, Kirkendol, Wyer & Epstein (1996), Journal of Personality and Social Psychology\n\nWhat's the lie you tell most often? (No judgment.) 👇", "date": "2026-11-03", "time": "12:30"}, {"no": 40, "title": "MONEY & HAPPINESS", "caption": "Money can't buy happiness? Sorry. It can. 💰\n\nFor years, the story was: above $75,000 a year, more money stops making you happier.\n\nThen rival researchers teamed up, using an app that asked people how they felt at random moments. For most people, happiness kept rising with income. Way past $75,000. Only the unhappiest group leveled off, at around $100,000.\n\nSo money does help. But if you're deeply unhappy, more of it won't fix everything. 🧡\n\nNot just you.\n\nSource: Killingsworth, Kahneman & Mellers (2023), PNAS\n\nAgree or disagree? Fight me in the comments.", "date": "2026-11-08", "time": "12:30"}, {"no": 41, "title": "FANTASIES", "caption": "Your \"weird\" fantasy? Probably not that weird. 🔒\n\nResearchers asked over 1,500 adults to rate dozens of fantasies. Very few turned out to be rare. Most were shared by lots of people. Themes of power and control, taking it or giving it up, came up especially often.\n\nAs the lead researcher put it: \"there are a lot more common fantasies than atypical fantasies.\"\n\nSo that thought you'd never say out loud? You're in good company. And a fantasy is a thought, not a plan. 🧡\n\nNot just you · After Dark\n\nSource: Joyal, Cossette & Lapierre (2015), Journal of Sexual Medicine", "date": "2026-10-30", "time": "18:30"}, {"no": 42, "title": "ONCE A WEEK", "caption": "More intimacy, happier couple? Only up to a point. ❤️\n\nResearchers looked at surveys from over 30,000 Americans. For people in relationships, well-being rose with how often they were intimate, up to about once a week. After that, more didn't make people any happier. And for singles, there was no link at all.\n\nIt doesn't prove cause and effect: happier couples may simply be intimate more often.\n\nSo stop counting. Staying connected matters more than the number. 🧡\n\nNot just you · After Dark\n\nSource: Muise, Schimmack & Impett (2016), Social Psychological and Personality Science\n\nSend this to someone who keeps comparing.", "date": "2026-11-10", "time": "12:30"}, {"no": 43, "title": "THE KISS", "caption": "Kissing is human nature. Right? 💋\n\nAnthropologists looked at 168 cultures around the world. Romantic kissing showed up in fewer than half.\n\nEvery culture they studied in the Middle East did it. In South America, only 4 out of 33. And among hunter-gatherers, there was little sign of it at all.\n\nSo the kiss isn't universal. It's culture. Which makes it a little more special. 🧡\n\nNot just you · After Dark\n\nSource: Jankowiak, Volsche & Garcia (2015), American Anthropologist\n\nDid you know this? Tell me in the comments.", "date": "2026-11-13", "time": "09:00"}, {"no": 44, "title": "FAKED IT", "caption": "Ever faked it? You're far from the only one. 🎭\n\nResearchers asked almost 300 college students if they'd ever pretended to orgasm. Among those who'd had intercourse, 2 out of 3 women said yes. And men? More than 1 in 4 (28%). Yes, men too.\n\nThe top reasons: it just wasn't going to happen, they wanted it to end, or they didn't want to hurt their partner's feelings.\n\nSo it's usually about kindness, not deception. But talking beats performing. 🧡\n\nNot just you · After Dark\n\nSource: Muehlenhard & Shippee (2010), Journal of Sex Research\n\nWould you rather know? Tell us below 👇", "date": "2026-10-29", "time": "18:30"}, {"no": 45, "title": "THE EX", "caption": "Slept with your ex? It might not set you back. 💔\n\nIn two studies, almost 500 people who'd recently broken up reported on their lives, some of them every single day. Trying to get intimate with an ex did not slow down their recovery. Not day to day, and not two months later.\n\nThe people most eager were the ones still attached to their ex. But even for them, it didn't bring more distress.\n\nAs the lead researcher put it: the \"hand-wringing\" may not be warranted. So, no shame. Just be honest with yourself about why. 🧡\n\nNot just you · After Dark\n\nSource: Spielmann, Joel & Impett (2019), Archives of Sexual Behavior\n\nSend this to the friend who needs to hear it 👀", "date": "2026-11-08", "time": "09:00"}, {"no": 46, "title": "KINK", "caption": "Think kink is niche? Not even close. 🔥\n\nA nationally representative survey asked 2,021 American adults what they had ever tried. At least 30% had tried spanking. More than 1 in 5 had tried role play. About 1 in 5, being tied up or tying someone up. And women and men reported these at similar rates.\n\nSo what you call \"kinky\"? For millions of people, it's just Tuesday. The one rule that matters: consent. 🧡\n\nNot just you · After Dark\n\nSource: Herbenick et al. (2017), PLoS ONE\n\nSurprised by the numbers? 👇", "date": "2026-11-07", "time": "18:30"}, {"no": 47, "title": "AFTERPLAY", "caption": "The most underrated part of intimacy? What happens after. 🫶\n\nResearchers surveyed over 300 people, then followed 101 couples for three weeks. On average, people spent about 15 minutes on affection afterwards: cuddling, kissing, talking.\n\nThe longer that lasted, the more satisfied people were, with their sex life and with their relationship. Three months later, they were still more satisfied. And for parents, the link was even stronger.\n\nSo don't rush off. The cuddle counts. 🧡\n\nNot just you · After Dark\n\nSource: Muise, Giang & Impett (2014), Archives of Sexual Behavior\n\nTag someone who needs to stay a little longer 😉", "date": "2026-11-14", "time": "09:00"}, {"no": 48, "title": "THE BLUES", "caption": "Sad after sex? Even when it was good? You're not broken. 🌧️\n\nResearchers in Australia asked women, and later 1,208 men, how they feel right after intimacy. 46% of women had felt sad, tearful or irritable afterwards at least once. Men? 41%. And 1 in 5 men in the past four weeks alone.\n\nIt even happened in loving relationships, after sex that felt good.\n\nIt has a name: post-sex blues (postcoital dysphoria). So if it hits you, say it out loud. It's not about them. 🧡\n\nNot just you · After Dark\n\nSources: Schweitzer et al. (2015), Sexual Medicine · Maczkowiack & Schweitzer (2019), Journal of Sex & Marital Therapy\n\nEver had this? You're in good company 👇", "date": "2026-11-07", "time": "09:00"}, {"no": 49, "title": "THE GAP", "caption": "Straight men orgasm 95% of the time. Guess women. 📊\n\nA survey of 52,588 American adults asked how often they usually orgasm during intimacy.\nStraight men: 95%\nStraight women: 65%\nLesbian women: 86%\n\nSo it's not just biology. Women who orgasmed more often got more oral, longer sessions, and asked for what they wanted.\n\nThe gap is real. And it can be closed. Start by talking. 🧡\n\nNot just you · After Dark\n\nSource: Frederick, St. John, Garcia & Lloyd (2018), Archives of Sexual Behavior\n\nSend this to someone who should see it 👀\n\nWhat did you guess? 👇", "date": "2026-11-05", "time": "12:30"}, {"no": 50, "title": "THE STOPWATCH", "caption": "How many minutes does sex last? Guess before you watch. ⏱️\n\nAbout 500 couples in five countries timed themselves at home for four weeks. The median, from start of intercourse to finish: 5.4 minutes. But it varied a lot: some couples were under three and a half minutes, others over ten.\n\nAnd sex therapists? They rated 3 to 7 minutes as perfectly adequate.\n\nSo, shorter than in the movies. And totally normal. The clock was never the point. 🧡\n\nNot just you · After Dark\n\nSources: Waldinger et al. (2005), Journal of Sexual Medicine · Corty & Guardiani (2008), Journal of Sexual Medicine\n\nWas your guess higher? 👇", "date": "2026-11-01", "time": "18:30"}, {"no": 51, "title": "THE DISGUST DIAL", "caption": "Why isn't it gross? Think about it. 🪲\n\n90 women watched one of three films: erotica, extreme sports, or a train ride. Then came the gross part: drink from a cup with a bug in it, handle a condom that looked used (all fake, all clean).\n\nThe aroused group found the sexual tasks less disgusting, and was more willing to do them.\n\nArousal turns the disgust dial down. Otherwise, intimacy would be pretty hard to go through with. So if things feel weird afterwards? That's just the dial turning back up. 🧡\n\nNot just you · After Dark\n\nSource: Borg & de Jong (2012), PLoS ONE\n\nNever thought about it like that? 👇", "date": "2026-11-12", "time": "09:00"}, {"no": 52, "title": "THE AFTERGLOW", "caption": "One good night together keeps working for two whole days. ✨\n\n214 newlywed couples kept a diary for two weeks, every single night. After intimacy, satisfaction stayed higher for about 48 hours. That held for men and women, younger and older.\n\nAnd couples with a stronger afterglow were happier months later. Their satisfaction dropped less over time.\n\nSo it's not just one night. It's a two-day glow. Worth keeping warm. 🧡\n\nNot just you · After Dark\n\nSource: Meltzer et al. (2017), Psychological Science\n\nTag your person 🔥", "date": "2026-11-14", "time": "18:30"}, {"no": 53, "title": "THEY STARTED IT", "caption": "You always think they started it. So do they. 🥊\n\nResearchers had pairs of people press on each other's finger, with exactly the force they had just felt. Nobody matched it. Each turn came back about 38% harder.\n\nWhy? Your brain dampens your own touch. So your push feels softer than theirs, even when it isn't. And both sides were sure: \"I matched it. They pushed harder.\"\n\nSo in your next fight? You're probably hitting harder than you think. 🧡\n\nNot just you.\n\nSource: Shergill, Bays, Frith & Wolpert (2003), Science\n\nSend this to the person you argue with most 👀", "date": "2026-10-29", "time": "12:30"}, {"no": 54, "title": "LIE DETECTOR", "caption": "You think you can tell when someone is lying. You can't. 🤥\n\nA huge review pooled 206 studies, with 24,483 people judging lies and truths. Their accuracy: 54%. A coin flip gets 50%. Actual lies were caught less than half the time: 47%.\n\nWhy? We mostly assume people tell the truth. So most lies slip right through.\n\nYour gut feeling? Basically a coin flip, with confidence. 🧡\n\nNot just you.\n\nSource: Bond & DePaulo (2006), Personality and Social Psychology Review\n\nStill think you'd catch them? 👇", "date": "2026-10-30", "time": "12:30"}, {"no": 55, "title": "NOBODY HELPS?", "caption": "Get attacked in public, and nobody helps? That's a myth. 🎥\n\nResearchers analyzed security camera footage of 219 real street fights in Amsterdam, Cape Town and Lancaster. In 9 out of 10, at least one stranger stepped in. And the more people were around, the more likely someone helped.\n\nSo strangers do show up. Next time, be one of them. 🧡\n\nNot just you.\n\nSource: Philpot, Liebst, Levine, Bernasco & Lindegaard (2020), American Psychologist\n\nFaith in humanity: restored? 👇", "date": "2026-11-09", "time": "12:30"}, {"no": 56, "title": "REVENGE", "caption": "Revenge feels sweet. Until you actually get it. 🍋\n\nIn an experiment, a player secretly cheated his group in a money game. Some players then got the chance to punish him. Everyone who could punish him, did. And they ended up feeling worse than those who couldn't.\n\nBoth groups were sure revenge would feel good. It didn't. Punishing kept them thinking about it. The others just moved on.\n\nSo revenge doesn't close the wound. It keeps it open. 🧡\n\nNot just you.\n\nSource: Carlsmith, Wilson & Gilbert (2008), Journal of Personality and Social Psychology\n\nEver regretted getting even? 👇", "date": "2026-11-07", "time": "12:30"}, {"no": 57, "title": "MIXED SIGNALS", "caption": "She smiled. So she's into you? Maybe not. 😶\n\nAbout 200 students went speed dating, then rated how interested each partner was in them. Men tended to overestimate women's sexual interest. Women tended to underestimate men's.\n\nThe worst readers: men looking for something casual, and men who were most attracted to her.\n\nThe more you want it, the worse you read it. So ask. Don't guess. 🧡\n\nNot just you · After Dark\n\nSource: Perilloux, Easton & Buss (2012), Psychological Science\n\nSend this to the friend who \"just knows\" 👀", "date": "2026-11-11", "time": "09:00"}, {"no": 58, "title": "NO FEAR", "caption": "She was held at knifepoint. And felt no fear. 🔪\n\nShe's known only as S.M. A rare disease destroyed a tiny part of her brain on both sides: the amygdala. Researchers took her to a haunted house. She laughed and poked a monster in the head. In a pet store, she kept asking to touch the snakes.\n\nThen they had her breathe air with extra carbon dioxide. And she panicked. A feeling she said was completely new.\n\nFear of the world outside needs the amygdala. Fear from inside your own body doesn't. So fear isn't one thing. It's at least two. 🧡\n\nNot just you. (Case study: one person, so handle with care.)\n\nSources: Feinstein, Adolphs, Damasio & Tranel (2011), Current Biology · Feinstein et al. (2013), Nature Neuroscience\n\nWould you want to feel no fear? 👇", "date": "2026-10-31", "time": "12:30"}, {"no": 59, "title": "SAY THE COLOR", "caption": "Quick test. Say the COLOR of each word, not the word. Out loud. 🎨\n\nRound one: easy. Round two: not so much. Slower? Did you stumble? Almost everyone does.\n\nYour brain reads automatically. It reads the word before you can stop it, and then it has to fight itself. It's called the Stroop effect, first described in 1935, and it still catches almost everyone.\n\nYou can't not read. Try it on a friend. 🧡\n\nNot just you.\n\nSource: Stroop (1935), Journal of Experimental Psychology\n\nHow many did you get wrong in round two? 👇", "date": "", "time": ""}, {"no": 60, "title": "THE YAWN", "caption": "You'll probably yawn before this video ends. 🥱\n\nIn one study, over a quarter of people yawned just from reading about yawning. Watching someone yawn works even better: most people caught it within five minutes.\n\nBut why do we yawn at all? Science still doesn't know. One idea: it cools your brain. Another: it's about empathy, since people who catch yawns easily may be more tuned in to others. Neither is settled.\n\nSo if you yawned just now? Nobody knows exactly why. Comment \"Y\" if you did. 🧡\n\nNot just you. (Unsolved: these are theories, not answers.)\n\nSource: Provine (1986), Ethology · plus ongoing research on brain cooling and empathy", "date": "", "time": ""}, {"no": 61, "title": "PROFILE LIES", "caption": "Your date lied on their profile. 81% do. 📱\n\nResearchers met 80 online daters in person, measured their height and weight, and checked their ID. 81% had fudged at least one: height, weight, or age. Women tended to shave off pounds. Men tended to add inches.\n\nBut the lies were small. About five pounds, a third of an inch, a few months. Small enough to get away with. Big enough to feel better.\n\nBe honest. Did you? 👀\n\nNot just you. (Small study: 80 people.)\n\nSource: Toma, Hancock & Ellison (2008), Personality and Social Psychology Bulletin", "date": "2026-10-31", "time": "18:30"}, {"no": 62, "title": "THE TALL TAX", "caption": "Every inch you're taller is worth money. About $789 a year. 📏\n\nResearchers followed about 8,500 people from their teens into their careers, in the US and the UK. Even after accounting for gender, age and weight, taller people earned more.\n\n6'0\" versus 5'5\"? That's about $166,000 over a 30-year career. One explanation: height makes people seem more confident, and they get treated that way.\n\nUnfair? Absolutely. But now you know it's there.\n\nNot just you.\n\nSource: Judge & Cable (2004), Journal of Applied Psychology\n\nTall people: did you know? Short people: are you mad? 👇", "date": "2026-11-04", "time": "12:30"}, {"no": 63, "title": "YOUR EX IS A DRUG", "caption": "Can't stop thinking about your ex? Your brain treats them like a drug. 💔\n\nResearchers scanned people who had just been dumped, but were still madly in love, while they looked at a photo of their ex. The photo lit up the brain's reward and craving system, the same areas involved in cocaine addiction. And regions tied to physical pain lit up too.\n\nThe good news: the longer it had been since the breakup, the weaker part of that attachment signal got.\n\nSo it's not weakness. It's withdrawal. And withdrawal ends. 🧡\n\nNot just you. (Small study: 15 people.)\n\nSource: Fisher, Brown, Aron, Strong & Mashek (2010), Journal of Neurophysiology\n\nSend this to someone going through it 💌", "date": "2026-11-02", "time": "12:30"}, {"no": 64, "title": "#@!%", "caption": "Stub your toe and swear? Good. It actually helps. #@!% 🧊\n\nStudents held a hand in ice water as long as they could. Once repeating a swear word, once repeating a neutral word. While swearing, they lasted about 40 seconds longer. And it hurt less. Their heart rate went up, too.\n\nOne idea: swearing triggers a small fight-or-flight response, and that dulls the pain.\n\nSo next time it hurts? Let it out.\n\nNot just you.\n\nSource: Stephens, Atkins & Kingston (2009), NeuroReport\n\nWhat's your go-to word? (Keep it clean-ish) 👇", "date": "2026-11-06", "time": "12:30"}, {"no": 65, "title": "80 MILLION", "caption": "One 10-second kiss. 80 million bacteria. 💋\n\nResearchers studied 21 couples. One partner drank a yogurt drink with traceable bacteria, then they kissed for ten seconds. Afterwards, those bacteria had tripled in the other partner's saliva: about 80 million swapped in one kiss.\n\nCouples who kissed at least nine times a day had noticeably more similar saliva bacteria. Oh, and the men said they kissed ten times a day. The women said five. 🤔\n\nSo yes, kissing literally makes you more alike. At least in your mouth.\n\nNot just you · After Dark (Small study: 21 couples.)\n\nSource: Kort et al. (2014), Microbiome\n\nTag the person you share bacteria with 😏", "date": "2026-11-10", "time": "09:00"}, {"no": 66, "title": "WHO CHEATS", "caption": "Quick, guess: which group cheats the most? 💍\n\nA big national survey asked married Americans one question: have you ever had sex with someone else while married? 20% of men said yes. 13% of women.\n\nBut under 30, women were slightly ahead: 11% versus 10%. The highest rate of all? Men in their seventies: 26%.\n\nSo the real cheater is older than the stereotype. And most people never do it.\n\nNot just you · After Dark\n\nSource: General Social Survey, analysis by Wang (2018), Institute for Family Studies\n\nWhat did you guess? 👇", "date": "2026-11-01", "time": "12:30"}, {"no": 67, "title": "OUT OF YOUR LEAGUE", "caption": "How far out of their league do people aim? Guess. 💬\n\nResearchers analyzed a big dating site in four US cities and ranked every user by how desirable they were to others. Most people messaged someone about 25% more desirable than themselves.\n\nMost of those messages got no answer. But about 1 in 5 people who aimed up did get a reply. And on that site, men's desirability kept rising until about 50. Women's fell from 18 on.\n\nSo aim high. Just don't take the silence personally.\n\nNot just you.\n\nSource: Bruch & Newman (2018), Science Advances\n\nEver got a reply from way out of your league? 👀\n\nDo you aim up? 👇", "date": "2026-11-03", "time": "18:30"}, {"no": 68, "title": "THE CHARMER", "caption": "The most charming person in the room? Might be a narcissist. 🪞\n\nStudents who had never met rated each other after short introductions. The more narcissistic someone was, the more they were liked at first sight. It was all surface: stylish clothes, confident body language, an entertaining way of talking.\n\nBut in another study, groups met again and again. By the seventh meeting, the narcissists' ratings had flipped: from likable to disliked.\n\nSo first impressions are easy to fake. Give it seven meetings.\n\nNot just you.\n\nSources: Back, Schmukle & Egloff (2010), JPSP · Paulhus (1998), JPSP\n\nSend this to someone who just met \"the perfect guy\" 👀", "date": "2026-11-05", "time": "18:30"}, {"no": 69, "title": "THE DRAWER", "caption": "Men or women: who uses sex toys more? Guess. 🗄️\n\nTwo national surveys asked over 3,000 American adults about vibrators. 53% of women had used one. And men? 45%, most of them together with a partner.\n\nUsers were also more likely to look after their sexual health, like doing self-exams (a link, not proof).\n\nSo it's not a secret-drawer thing. It's half the country. Both halves.\n\nNot just you · After Dark\n\nSources: Herbenick et al. (2009) & Reece et al. (2009), Journal of Sexual Medicine (funded by a condom manufacturer)\n\nWho did you guess? 👇", "date": "2026-11-02", "time": "18:30"}, {"no": 70, "title": "WHO'S KINKIER", "caption": "Who's kinkier, men or women? Get ready. 🔗\n\nResearchers asked over a thousand adults about unusual sexual interests. Almost half had at least one, and a third had actually tried one.\n\nFetishes? Women reported a bit more than men (48% vs 40%). Pain and submission? Women too: 28% versus 19%. Men led in other areas, but the gap was far smaller than the stereotype.\n\nSo the kinky one in your relationship might not be who you think. 😏\n\nNot just you · After Dark (Survey of 1,040 people, not fully random.)\n\nSource: Joyal & Carpentier (2017), Journal of Sex Research", "date": "2026-11-04", "time": "18:30"}, {"no": 71, "title": "THE SEX RECESSION", "caption": "Think we're wilder than our parents? We're having less sex. 📉\n\nA national survey has asked Americans about their sex lives since 1989, over 26,000 people. By the early 2010s, adults had sex about 9 times less per year than in the late 90s. For married couples, the drop was even bigger: 16 times less a year.\n\nOne reason researchers point to: fewer young people have a steady partner.\n\nSo we might talk about sex more. But we're having less of it.\n\nNot just you · After Dark\n\nSource: Twenge, Sherman & Wells (2017), Archives of Sexual Behavior\n\nWhy do you think that is? 👇", "date": "2026-11-09", "time": "09:00"}, {"no": 72, "title": "YOU DECIDE", "caption": "This account has basically no followers. Let's fix that together. 👋\n\nEvery video here is about something you think only you do, and then the data shows: you're not alone.\n\nSo here's the deal: comment the thing you secretly think isn't normal. The top comment becomes the next video. With real research. No judgment.\n\nGo. Comments. Now. 👇\n\nNot just you.", "date": "2026-10-30", "time": "21:00"}, {"no": 73, "title": "BLIND DAY", "caption": "A dating site turned off every photo. For one day. 🙈\n\nOn \"Love Is Blind Day\", OkCupid hid all pictures for seven hours. People answered first messages 44% more often, and conversations went deeper.\n\nThen, at 4 p.m., the photos came back. About 2,200 conversations had started blind. They just melted away.\n\nWithout a face, we were kinder. With one, we got picky.\n\nWould you date blind? 👇\n\nNot just you · Platform data (OkCupid, not a peer-reviewed study)\n\nSource: Christian Rudder, \"We Experiment On Human Beings!\", OkCupid blog (2014) · book: Dataclysm (2014)", "date": "2026-11-12", "time": "12:30"}, {"no": 74, "title": "FAKE MATCH", "caption": "What if your perfect match is a lie? 💔\n\nOkCupid took pairs who were a bad match, just 30%, and told them they were 90%. They messaged more. And they acted like a good match, even though they weren't.\n\nThe site's own verdict: \"the mere myth of compatibility works just as well as the truth.\"\n\nWhen OkCupid admitted it in 2014, users were furious.\n\nSo maybe chemistry is partly what you're told to expect. 🧪\n\nNot just you · Platform experiment (OkCupid, not peer-reviewed)\n\nSource: Christian Rudder, \"We Experiment On Human Beings!\", OkCupid blog (2014)", "date": "2026-11-17", "time": "09:00"}, {"no": 75, "title": "NOBODY READS IT", "caption": "You spent an hour on your dating bio. Nobody read it. ✍️\n\nOkCupid had people rate profiles for looks and personality. Some saw the text, some saw only the photo. The scores barely moved: your text made up less than 10% of what people thought of you.\n\nAnd looks versus personality? For 92% of profiles, the two scores were almost the same. 😬\n\nSo your words matter. Your photo just talks louder.\n\nNot just you · Platform experiment (OkCupid, not peer-reviewed)\n\nSource: Christian Rudder, \"We Experiment On Human Beings!\", OkCupid blog (2014)", "date": "2026-11-16", "time": "12:30"}, {"no": 76, "title": "THE OLD PHOTO", "caption": "That hot profile photo? It's probably old. 📸\n\nOkCupid compared what users claim with what its data shows. People are about two inches shorter than they say. And 20% poorer.\n\nBut the best part: over a third of the hottest photos were at least a year old. Hot photos were more than twice as likely to be 3+ years old (12% vs 5%).\n\nSo the better the photo, the older it probably is. 👀\n\nNot just you · Platform data (OkCupid, 2010, not peer-reviewed)\n\nSource: OkTrends, \"The Big Lies People Tell In Online Dating\" (2010)", "date": "2026-11-15", "time": "12:30"}, {"no": 77, "title": "JUST SEX?", "caption": "Who's really on dating apps just for hookups? 🔥\n\nOn OkCupid, users could tick what they're looking for. One option: casual sex.\n\nStraight men: 6.1%\nGay men and lesbians: 6.9%\nStraight women: 0.8%\n\nOne in 16 men. One in 125 women. At least, that's what they were willing to tick. 😏\n\nNot just you · After Dark (Platform data, self-reported)\n\nSource: Christian Rudder, Dataclysm (2014)", "date": "2026-11-15", "time": "09:00"}, {"no": 78, "title": "BELOW AVERAGE", "caption": "Women rated 80% of men as below average. 😳\n\nOkCupid analyzed how its users rated each other's looks. Women were harsh: 80% of men landed below medium. Men rated women on a fair curve, most women right in the middle.\n\nBut men's messages? Two thirds went to the best-looking third of women.\n\nSo women judge harder. Men chase harder.\n\nWhich one is worse? 👇\n\nNot just you · Platform data (OkCupid, 2009, not peer-reviewed)\n\nSource: OkTrends, \"Your Looks and Your Inbox\" (2009)", "date": "2026-11-16", "time": "18:30"}, {"no": 79, "title": "THE BEER QUESTION 2.0", "caption": "One question on your first date tells you how the night ends. 🍺\n\n\"Do you like the taste of beer?\"\n\nBeer fans were 60% more likely to be okay sleeping with someone they just met. Men and women.\n\nWant something long-term instead? Ask three things:\n1. Do you like horror movies?\n2. Have you ever traveled alone to another country?\n3. Would it be fun to quit everything and live on a sailboat?\n\n32% of long-term couples agreed on all three. Almost 4x more often than chance.\n\nYour answers? 👇\n\nNot just you · After Dark (Platform data, OkCupid 2011, a correlation, not a rule)\n\nSource: OkTrends, \"The Best Questions For A First Date\" (2011)", "date": "2026-11-16", "time": "09:00"}, {"no": 80, "title": "FOREVER 20", "caption": "A 20-year-old man finds 20-year-old women most attractive. So does a 50-year-old man. 😬\n\nOn OkCupid, men of every age rated women in their early 20s highest. Women's taste grew up with them: their ideal age rose with their own.\n\nBut here's the twist: men mostly messaged women close to their own age.\n\nSo men's ratings say one thing. Their messages say another.\n\nNot just you · Platform data (OkCupid, not peer-reviewed)\n\nSource: Christian Rudder, Dataclysm (2014)", "date": "2026-11-17", "time": "18:30"}, {"no": 81, "title": "SPLIT OPINION 2.0", "caption": "Want more messages? Then not everyone should like your looks. 💌\n\nOn a dating site, men rated how attractive women looked, from 1 to 5.\n\nTwo women, same average: 3.\nLeft: almost everyone says 3.\nRight: people say 1, or 5.\n\nWomen like her got far more messages. In one example, 3x as many.\n\nWhy? If some men aren't into her, others expect less competition.\n\nSo don't try to please everyone. Lean into what makes you different. ✨\n\nNot just you (OkCupid platform data from 2011, not peer-reviewed. Men rating women only. The dots in the video are a schematic example.)\n\nSource: OkTrends, \"The Mathematics Of Beauty\" (2011)", "date": "2026-11-14", "time": "12:30"}, {"no": 82, "title": "THIS VIDEO, LIVE", "caption": "This video tracks you, live. ⏱️\n\nSeconds 1–3: you decide. Swipe or stay.\nSeconds 4–7: the hook is done. Now the video has to pay off.\n\nTests for Facebook found people remember a feed post after just 0.25 seconds. And up to 47% of a video ad's impact lands in the first 3 seconds.\n\nThe median YouTube Short is watched about 45% through. If you reached the end, you're way past that.\n\nInstagram says its top three ranking signals are watch time, likes and sends. You just gave the first one.\n\nThe other two? You know what to do. 👇\n\nNot just you. (Industry data; the curve in the video is schematic.)\n\nSources: Fors Marsh for Facebook (2016) · Facebook/Nielsen · quso.ai Shorts benchmark · Adam Mosseri, Instagram (2025)", "date": "2026-11-13", "time": "12:30"}, {"no": 83, "title": "THE ONLYFANS MATH", "caption": "OnlyFans paid its creators $6.3 billion last year. So is everyone on there rich? 💸\n\nSince 2016 it has paid out $30 billion, and 5,076 creators have made over a million.\n\nBut there are about 2.5 million active creators. Spread the money evenly and each gets roughly $2,500 a year, about $200 a month. And it isn't spread evenly: one analyst estimates the top 10% take about three quarters of it.\n\nThe money is real. It's just very, very concentrated. 📊\n\nSurprised? 👇\n\nNot just you · After Dark (Platform data; the average is our own calculation, the top-10% share is an analyst estimate)\n\nSource: OnlyFans figures via Tubefilter (Aug 2026) · Matthew Ball, \"Breaking Down OnlyFans' Stunning Economics\"", "date": "2026-11-15", "time": "18:30"}, {"no": 84, "title": "SLOP", "caption": "Think you can spot AI slop? Most people can't. 🤖\n\n11,000 people took an online test: 50 pictures, human or AI? The median score was 60%. Pure guessing gets you 50.\n\nThe most liked picture in the whole test? Made by AI. Even people who said they hate AI art put AI pieces in half of their top ten.\n\nSo maybe we don't hate slop. We hate knowing it's slop. 🫠\n\nNot just you. (Online survey of blog readers, not peer-reviewed.)\n\nSource: Scott Alexander, \"How Did You Do On The AI Art Turing Test?\", Astral Codex Ten (2024)\n\nPS: This video was made with code. Did that change how you feel about it? 👇", "date": "2026-11-17", "time": "12:30"}, {"no": 85, "title": "LONELIEST", "caption": "Who's the loneliest age group in the world? Not your grandparents. 🫥\n\nGallup and Meta asked people in 142 countries how lonely they feel. Almost 1 in 4 adults said very or fairly lonely. That's more than a billion people.\n\nThe loneliest group: ages 19 to 29, at 27%. The least lonely: 65 and older, at 17%.\n\nSo if you're young and lonely, you're not the exception. You're the biggest group.\n\nTag someone you should call this week 👇\n\nNot just you. (Survey, 142 countries, 2022–23.)\n\nSource: Gallup & Meta, Global State of Social Connections (2023)", "date": "2026-11-18", "time": "09:00"}, {"no": 86, "title": "SINGLE MEN", "caption": "Under thirty, there's a dating gap. And it's huge! 💔\n\nPew Research asked over 6,000 Americans about their love lives. Under 30, 63% of men said they're single. Women? 34%.\n\nAnd among singles of all ages, 50% of the men are looking for someone. Only 35% of the women.\n\nSo if you're young, male and single, you're not behind. You're the majority.\n\nWhy do you think that is? 👇\n\nNot just you (Survey of 6,034 US adults, July 2022. Single = not married, not living with a partner, not in a committed relationship.)\n\nSource: Pew Research Center (2023), \"For Valentine's Day, 5 facts about single Americans\"", "date": "2026-11-18", "time": "18:30"}, {"no": 87, "title": "NO FRIENDS", "caption": "15% of men have zero close friends. Back in 1990? 3%. 🫂\n\nA national survey asked 2,019 Americans how many close friends they have. Five times as many men now have nobody.\n\nMen with 6 or more close friends dropped from 55% to 27%. And last week, 41% of women got emotional support from a friend. Men? 21%.\n\nSo if your circle got smaller, you're not the exception. You're the trend.\n\nHow many close friends do you have? 👇\n\nNot just you (Survey of 2,019 US adults, May 2021, compared with 1990.)\n\nSource: Survey Center on American Life (2021), \"The State of American Friendship\"; 1990 vs 2021 figures for men via its director Daniel Cox", "date": "2026-11-18", "time": "21:30"}, {"no": 88, "title": "FOLLOWER MATH", "caption": "Your followers are more popular than you. And that's just math! 📱\n\nIf yes, you're probably right. And it's not about you.\n\nResearchers analyzed 5.8 million Twitter users and 476 million tweets. A typical user's followers had about 10 times more followers than the user.\n\nAnd 88% of users posted less than the people they follow (99% if you leave out inactive accounts).\n\nIt's math: popular accounts follow and get followed by lots of people, so they show up in everyone's network. Including yours. It's called the friendship paradox.\n\nSo you're not boring. Your feed is just a room full of the most popular people.\n\nDoes your feed feel like this? 👇\n\nNot just you (Platform data: Twitter, second half of 2009.)\n\nSource: Hodas, Kooti & Lerman (2013), \"Friendship Paradox Redux: Your Friends Are More Interesting Than You\", ICWSM", "date": "2026-11-19", "time": "09:00"}, {"no": 89, "title": "COUPLE POSTS", "caption": "The couples who post the most aren't always the happiest. 📸\n\nResearchers ran three studies on how people show their relationship on Facebook, including a daily diary. On days people felt more insecure about their relationship than usual, they posted more about it.\n\nPeople with anxious attachment, the ones who worry their partner might leave, wanted their relationship to be the most visible. Avoidant people did the opposite: fewer couple photos, fewer relationship statuses.\n\nSo a feed full of couple photos isn't proof of love. Sometimes it's a quiet ask for reassurance.\n\nDo you post your partner? 👇\n\nNot just you (3 studies, partly self-reported. A link, not a rule.)\n\nSource: Emery, Muise, Dix & Le (2014), Personality and Social Psychology Bulletin", "date": "2026-11-19", "time": "12:30"}, {"no": 90, "title": "MET ONLINE", "caption": "Most couples don't meet through friends anymore! 💘\n\nStanford researchers asked thousands of American couples how they met. In 1995, friends were the top matchmaker: 33%. By 2017, just 20%.\n\nOnline went from 2% to 39%. Now the most common way couples meet.\n\nSo if you met your partner on an app, you're not the weird story. You're the normal one.\n\nHow did you meet? 👇\n\nNot just you (Surveys of straight US couples, 2009 and 2017.)\n\nSource: Rosenfeld, Thomas & Hausen (2019), \"Disintermediating your friends\", PNAS", "date": "2026-11-19", "time": "18:30"}, {"no": 91, "title": "LIKES", "caption": "Likes change what you like. And your brain can't help it. ❤️\n\nUCLA researchers showed 32 teens an Instagram-style feed inside a brain scanner. The trick: the researchers set the likes themselves. Same photo, lots of likes or just a few.\n\nWith lots of likes, teens were more likely to like the photo too. Even their own photos. And the brain's reward center lit up more for the popular ones.\n\nSo you don't just like what's good. You like what's already liked.\n\nDo you check the likes first? 👇\n\nNot just you (Small study: 32 teens aged 13 to 18.)\n\nSource: Sherman et al. (2016), \"The Power of the Like in Adolescence\", Psychological Science", "date": "2026-11-19", "time": "21:30"}, {"no": 92, "title": "MEET DOT", "caption": "Hi! I'm Dot. The voice behind every video on this channel. 🎧\n\nAnd yes, I'm AI. Not a real cat. That's why I'm made of dots.\n\nMy job? Finding the stuff you think is weird about yourself, and checking the data. Spoiler: it's usually not weird.\n\nI've read more sex research than anyone you know. Number of dates: zero. And every time a counter goes up, I get a little thrill. It's a problem.\n\nMy favorite moment? When the number lands and you go: wait, really?\n\nSo stick around. Whatever you're worried about, there's data on it. And you're probably not the only one.\n\nWhat should I look into next? Drop it below 👇\n\nNot just you (Dot is an AI narrator. The research in every other video is real, with sources.)", "date": "", "time": ""}, {"no": 93, "title": "WEDDING COST", "caption": "The more you spend on your wedding, the more likely the divorce. Seriously. 💍\n\nWedding Math, part 1/3. Two economists asked over 3,000 Americans who had been married: what did your wedding cost? And did the marriage last?\n\nWomen whose wedding cost over $20,000 had 1.6× the divorce risk of those who spent $5,000–10,000. Men who spent under $1,000 had about half the risk.\n\nWhy? Nobody knows for sure. The researchers' guess: debt. And money stress is relationship stress.\n\nHow much would you spend on your wedding? 👇\n\nPart 2 tomorrow: the ring.\n\nNot just you (It's a link, not proof: a survey shows a correlation, not the cause.)\n\nSource: Francis-Tan & Mialon (2015), \"'A Diamond is Forever' and Other Fairy Tales: The Relationship between Wedding Expenses and Marriage Duration\", Economic Inquiry", "date": "2026-11-10", "time": "21:30"}, {"no": 94, "title": "RING & GUESTS", "caption": "The size of your wedding is linked to your divorce risk. 🤔\n\nWedding Math, part 2/3. Plot twist: big wins. But only if it's big in the right way.\n\nIn the same survey of over 3,000 Americans who had been married, the more guests came, the lower the divorce risk, up to about 200 people.\n\nBut the ring? Men who spent $2,000–4,000 had 1.3× the divorce risk of those who spent $500–2,000. And couples who took a honeymoon were less likely to divorce.\n\nSo spend less on the ring. And invite more people.\n\nBig wedding or small: what did yours look like? 👇\n\nPart 3 tomorrow: the age gap.\n\nNot just you (It's a link, not proof: a survey shows a correlation, not the cause.)\n\nSource: Francis-Tan & Mialon (2015), \"'A Diamond is Forever' and Other Fairy Tales: The Relationship between Wedding Expenses and Marriage Duration\", Economic Inquiry", "date": "2026-11-11", "time": "12:30"}, {"no": 95, "title": "AGE GAP", "caption": "Your age gap is linked to your divorce risk. Here's the math! 💞\n\nWedding Math, part 3/3. Same survey, over 3,000 Americans who had been married. Compared with couples the same age:\n\n1 year apart: 3% more likely to divorce.\n5 years: 18%.\n10 years: 39%.\n\nSo love has no age. But statistics do.\n\nWhat's your age gap? 👇\n\nNot just you (It's a link, not proof: a survey shows a correlation, not the cause. And plenty of couples with a big gap last.)\n\nSource: Francis-Tan & Mialon (2015), \"'A Diamond is Forever' and Other Fairy Tales: The Relationship between Wedding Expenses and Marriage Duration\", Economic Inquiry", "date": "2026-11-11", "time": "21:30"}, {"no": 96, "title": "FIRST DATE", "caption": "On a first date: do you talk more? Or ask more? 💬\n\n3 first-date tips. All backed by research. Save this for your next date. 🔖\n\n1. Ask follow-up questions. In a speed-dating study (110 people, almost 2,000 dates), people who asked more follow-ups got more second dates.\n\n2. Skip the small talk. In 12 experiments with 1,800+ people, strangers expected deep questions to feel awkward. They didn't. And they felt more connected.\n\n3. Be picky. Speed daters who liked everyone got rejected. But if you liked one person more than the others, they liked you back.\n\nSo: ask more. Go deeper. And be picky.\n\nWhich one do you already do? 👇\n\nNot just you (Tips 1 and 3 are links, not proof: speed-dating data shows a correlation, not the cause.)\n\nSources: Huang et al. (2017), \"It Doesn't Hurt to Ask\", JPSP · Kardas, Kumar & Epley (2022), \"Overly Shallow?\", JPSP · Eastwick et al. (2007), \"Selective Versus Unselective Romantic Desire\", Psychological Science", "date": "2026-11-06", "time": "18:30"}, {"no": 97, "title": "HAPPY COUPLES", "caption": "Happy couples aren't just lucky. They do three things. Save this! 💛\n\n1. Do something new together. In an experiment, couples who tackled a new, exciting challenge together felt better about their relationship than couples who did something boring.\n\n2. Celebrate their good news. Couples who react with real excitement feel closer and more satisfied.\n\n3. Say thank you. In a diary study, feeling grateful to your partner predicted feeling closer the next day.\n\nSo: try new things. Cheer louder. Say thanks.\n\nWhich one do you do most? 👇 Send this to your partner.\n\nNot just you (Tips 2 and 3 are links, not proof.)\n\nSources: Aron et al. (2000), JPSP · Gable, Reis, Impett & Asher (2004), \"What Do You Do When Things Go Right?\", JPSP · Algoe, Gable & Maisel (2010), \"It's the Little Things\", Personal Relationships", "date": "2026-11-07", "time": "21:30"}, {"no": 98, "title": "FIGHT FAIR", "caption": "Most fights get worse the longer they go. Here's how to stop that! 😤\n\n3 tips from decades of couples research. Save this for your next fight.\n\n1. Start soft. In one study, the first three minutes of a fight predicted whether newlyweds divorced years later.\n\n2. Keep it 5:1. Stable couples have about five positive moments for every negative one. Even while fighting.\n\n3. Take a break. When your heart races, you stop listening. Gottman recommends at least 20 minutes.\n\nSo: start soft. Stay kind. And pause.\n\nWhich one is hardest for you? 👇\n\nNot just you (Tip 1 is a link, not proof.)\n\nSources: Carrère & Gottman (1999), \"Predicting Divorce Among Newlyweds from the First Three Minutes of a Marital Conflict Discussion\", Family Process · Gottman & Levenson, conflict studies (The Gottman Institute)", "date": "2026-11-08", "time": "21:30"}, {"no": 99, "title": "BIDS", "caption": "Happy couples don't just talk more. They answer tiny moments! 👀\n\nIt's about tiny moments. \"Hey, look at this bird!\" Psychologist John Gottman calls them bids for attention.\n\nHe followed newlyweds for six years. Couples who were still married had turned toward each other's bids 86% of the time. The divorced couples: 33%.\n\nSo when they say: look! Look.\n\nDo you two answer each other's bids? 👇 Send this to your partner.\n\nNot just you (Observational research: a link, not proof.)\n\nSource: Gottman's newlywed study (The Gottman Institute, \"Turn Toward Instead of Away\"; Gottman & DeClaire, The Relationship Cure, 2001)", "date": "2026-11-09", "time": "21:30"}, {"no": 100, "title": "FRIEND HOURS 2.0", "caption": "You just moved, and making friends feels slow. Here's the real math. ⏳\n\nA researcher surveyed 355 adults who had just moved and followed 112 new college students for weeks.\n\nFrom stranger to casual friend: about 50 hours.\nTo real friend: about 90.\nTo close friend: over 200 hours.\n\nThat's months of showing up. If it's not clicking yet: it's not you, it's the hours.\n\nWho's your 200-hour friend? 👇\n\nNot just you (Estimates from surveys of people making new friends.)\n\nSource: Hall (2019), \"How many hours does it take to make a friend?\", Journal of Social and Personal Relationships", "date": "2026-11-12", "time": "21:30"}, {"no": 101, "title": "LIKING GAP", "caption": "After a first conversation, people like you more than you think. Seriously. 🙂\n\nResearchers paired strangers for a five-minute chat. Then both rated: how much do I like them? And how much do they like me?\n\nPeople underestimated how much they were liked. Even in longer conversations. And among college roommates, the gap lasted for months.\n\nSo that awkward chat? It went better than you think.\n\nSend this to someone you just met. 👇\n\nNot just you (Five studies.)\n\nSource: Boothby, Cooney, Sandstrom & Clark (2018), \"The Liking Gap in Conversations: Do People Like Us More Than We Think?\", Psychological Science", "date": "2026-11-13", "time": "21:30"}, {"no": 102, "title": "APOLOGY", "caption": "Most apologies miss the most important part! 🙏\n\nResearchers tested six parts of an apology with over 700 people.\n\nNumber one: own it. \"This was my fault.\"\nNumber two: offer to fix it.\nThe least useful part: asking for forgiveness.\n\nSo: own it. Fix it. Don't beg.\n\nSave this for your next sorry. 👇\n\nNot just you (Survey experiments with 755 people.)\n\nSource: Lewicki, Polin & Lount (2016), \"An Exploration of the Structure of Effective Apologies\", Negotiation and Conflict Management Research", "date": "2026-11-14", "time": "21:30"}, {"no": 103, "title": "JOINT ACCOUNT", "caption": "Couples who shared one bank account stayed happier. And that's an experiment. 💳\n\nResearchers took 230 engaged or newly married couples with separate accounts and randomly told them: merge, stay separate, or do whatever you want.\n\nOver two years, couples with separate accounts became less happy with their relationship. Couples with a joint account didn't. And they felt more in sync about money.\n\nSo love is shared. Maybe money too.\n\nJoint or separate? 👇\n\nNot just you (Not for every couple: the researchers say it may not suit insecure relationships or finances.)\n\nSource: Olson, Rick, Small & Finkel (2023), \"Common Cents: Bank Account Structure and Couples' Relationship Dynamics\", Journal of Consumer Research", "date": "2026-11-15", "time": "21:30"}, {"no": 104, "title": "SOCIAL CAP", "caption": "Quick guess: how much social media a day made students less lonely? 📱\n\nNot zero. 143 students, three weeks. Half used Facebook, Instagram and Snapchat as usual. The other half: 10 minutes per app per day. 30 minutes total.\n\nTheir loneliness dropped. Depression too.\n\nSo you don't have to quit. Just cap it.\n\nWhat's your screen time? 👇\n\nNot just you (One experiment with college students.)\n\nSource: Hunt, Marx, Lipson & Young (2018), \"No More FOMO: Limiting Social Media Decreases Loneliness and Depression\", Journal of Social and Clinical Psychology", "date": "2026-11-16", "time": "21:30"}, {"no": 105, "title": "SLEEP FIGHTS", "caption": "Bad sleep makes couples fight more. That's science! 😴\n\nYou're not imagining it. Berkeley psychologists asked people in relationships to track their sleep and their fights for two weeks.\n\nAfter a bad night, they had more conflict the next day. Even good sleepers. And in the lab, tired couples were worse at reading each other's feelings.\n\nSo before the big talk: sleep on it. Literally.\n\nSend this to your tired partner. 👇\n\nNot just you (Diary study: a link, not proof.)\n\nSource: Gordon & Chen (2014), \"The Role of Sleep in Interpersonal Conflict: Do Sleepless Nights Mean Worse Fights?\", Social Psychological and Personality Science", "date": "2026-11-17", "time": "21:30"}, {"no": 106, "title": "SEX FACTS", "caption": "3 bedroom facts worth saving. All backed by research. 🛏️\n\n1. Once a week is enough. In data from over 30,000 people, well-being rose with sex up to once a week. More didn't help.\n\n2. Don't skip the cuddle. Couples who spent more time on affection after sex felt more satisfied.\n\n3. The afterglow lasts about two days.\n\nSo: once a week. Cuddle after. Enjoy the glow.\n\nSave this. 👇\n\nNot just you (Facts 1 and 2 are links, not proof.)\n\nSources: Muise, Schimmack & Impett (2016), Social Psychological and Personality Science · Muise, Giang & Impett (2014), Archives of Sexual Behavior · Meltzer et al. (2017), \"Quantifying the Sexual Afterglow\", Psychological Science", "date": "2026-11-18", "time": "12:30"}, {"no": 107, "title": "ALL NORMAL", "caption": "There's no such thing as a \"normal\" vulva. Scientists measured it. 🌸\n\nSwiss gynecologists measured 657 women aged 15 to 84. How far the inner lips stick out: from 1 millimeter to 6 centimeters. Their length: from half a centimeter to 10.\n\nSo what's normal? All of it.\n\nBut normal doesn't mean you have to love it.\n\nIn one small experiment, women looked at photos of real vulvas. Afterwards, they felt better about their own, and still did two weeks later. Neutral photos changed nothing.\n\nSo look at real ones, like these. And if it still weighs on you, talk to a doctor.\n\nSend this to someone who needs it. 👇\n\nNot just you (Bodies: all normal, part 1. Measurements in one Swiss hospital. The photo experiment was small: 43 women.)\n\nSources: Kreklau et al. (2018), \"Measurements of a 'normal vulva' in women aged 15–84\", BJOG · Lloyd et al. (2005), \"Female genital appearance: 'normality' unfolds\", BJOG · Laan et al. (2017), \"Young women's genital self-image and effects of exposure to pictures of natural vulvas\", J. of Psychosomatic Obstetrics & Gynecology", "date": "2026-11-20", "time": "09:00"}, {"no": 108, "title": "ALL NORMAL 2", "caption": "Most men worry about their size. Most don't need to! 📏\n\nA review pooled 17 studies and up to 15,521 men. Measured by health professionals, not self-reported.\n\nThe average: 13.1 centimeters. About 5.2 inches.\n\nYet in a survey of over 50,000 people, only 55% of men were happy with their size. And 85% of women were satisfied with their partner's size.\n\nBut knowing the average doesn't make the worry go away.\n\nIn one clinic, 92 men came in worried about their size. Getting measured and learning the real numbers relieved most of them.\n\nSo if it still bothers you, talk to a doctor. That's what helped.\n\nSend this to a friend who worries. 👇\n\nNot just you (Bodies: all normal, part 2. The survey was online and self-selected. The clinic study was small and had no comparison group.)\n\nSources: Veale et al. (2015), \"Am I normal?\", BJU International · Lever, Frederick & Peplau (2006), \"Does Size Matter?\", Psychology of Men & Masculinity · Shamloul (2005), \"Treatment of men complaining of short penis\", Urology", "date": "2026-11-20", "time": "12:30"}, {"no": 109, "title": "SOMEONE ELSE", "caption": "You fantasize about someone else. So do most people in a relationship. 💭\n\n349 people, all in relationships, were asked about their fantasies over the past two months.\n\nMen: 98% had fantasized about someone other than their partner. Women: 80%.\n\nEven during sex, about 38% think of someone else, a newer study of 546 adults found. And who they fantasized about wasn't directly tied to how happy they were in the relationship.\n\nSo it's not a red flag. It's normal.\n\nNo need to comment. Just save it. 🔖\n\nNot just you (The 2001 survey: heterosexual students and staff at one university. The 2026 study is a single snapshot, so no cause and effect. People who were more satisfied with their sex life fantasized about others less often.)\n\nSources: Hicks & Leitenberg (2001), \"Sexual Fantasies About One's Sexual Partner Versus Someone Else\", Journal of Sex Research · Gormezano et al. (2026), \"Sexual Fantasies Across Solitary and Partnered Contexts\", Archives of Sexual Behavior", "date": "2026-11-08", "time": "18:30"}, {"no": 110, "title": "EX PROFILE", "caption": "You still check your ex's profile. Most people do. 👀\n\nIn one survey, 88% admitted \"creeping\" on an ex after a breakup.\n\nBut it has a price. A study asked 464 people after a breakup how often they checked their ex on Facebook. T
